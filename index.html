<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polizei System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --panel: #10151f;
    --panel-2: #151b28;
    --border: #232b3a;
    --amber: #e0a94a;
    --amber-dim: #e0a94a55;
    --text: #dfe4ee;
    --text-dim: #8993a8;
    --ok: #4ade80;
    --err: #f87171;
    font-family: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    background-image:
      linear-gradient(rgba(224,169,74,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(224,169,74,0.03) 1px, transparent 1px);
    background-size: 28px 28px;
    min-height: 100vh;
  }
  a { color: var(--amber); }
  .center-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    padding: 20px;
    text-align: center;
  }
  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--amber);
    text-transform: uppercase;
  }
  h1 { font-size: 22px; margin: 0; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--amber);
    color: #14100a;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    text-decoration: none;
  }
  .btn.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.small { padding: 8px 14px; font-size: 13px; }
  .error-box {
    border: 1px solid var(--err);
    color: var(--err);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    max-width: 420px;
  }
  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header.topbar .brand {
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px;
    color: var(--amber);
    font-size: 13px;
    cursor: pointer;
  }
  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .user-chip img { width: 26px; height: 26px; border-radius: 50%; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
  .guild-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 20px;
  }
  .guild-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color .15s;
  }
  .guild-card:hover { border-color: var(--amber-dim); }
  .guild-card img, .guild-card .fallback-icon {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--amber);
  }
  .guild-card .meta { min-width: 0; }
  .guild-card .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .guild-card .sub { font-size: 12px; color: var(--text-dim); }
  .section-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-dim);
    margin: 32px 0 4px;
  }
  .invite-card {
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: space-between;
  }
  .invite-card .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .invite-card .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

  .stats-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .stats-panel h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 10px; }
  .stats-panel h2 img { width: 30px; height: 30px; border-radius: 50%; }
  .stat-row { display: flex; flex-wrap: wrap; gap: 18px; }
  .stat { min-width: 90px; }
  .stat .n { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: var(--amber); font-weight: 600; }
  .stat .l { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }
  .progress-bar {
    height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 10px;
  }
  .progress-bar .fill { height: 100%; background: var(--amber); }

  nav.categories {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  nav.categories button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 11px 14px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  nav.categories button:last-child { border-bottom: none; }
  nav.categories button:hover { background: var(--panel-2); color: var(--text); }
  nav.categories button.active { background: var(--panel-2); color: var(--amber); font-weight: 600; }

  .content-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .content-panel h2 { margin: 0 0 4px; font-size: 17px; }
  .field {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .field:first-of-type { border-top: none; margin-top: 14px; padding-top: 0; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .field .desc { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  select, input[type=text], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { min-height: 110px; resize: vertical; }
  select:focus, input:focus, textarea:focus { outline: 1px solid var(--amber); border-color: var(--amber); }
  .role-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .role-chip {
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    color: var(--text-dim);
  }
  .role-chip.active { border-color: var(--amber); color: var(--amber); background: #e0a94a1a; }
  .field-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .save-status { font-size: 12px; color: var(--text-dim); }
  .save-status.ok { color: var(--ok); }
  .save-status.err { color: var(--err); }
  .loading { color: var(--text-dim); padding: 40px; text-align: center; font-size: 14px; }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------------------------------------------------------------------
// KONFIGURATION: hier deine Discord-Application-Client-ID eintragen.
// ---------------------------------------------------------------------
const DISCORD_CLIENT_ID = "DEINE_CLIENT_ID_HIER";

const app = document.getElementById('app');
const state = { user: null, guilds: [], currentGuild: null, tier: null, schema: null, config: null, channels: [], roles: [], stats: null, activeCategory: null };

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function redirectUri() {
  return `${location.origin}/api/callback`;
}

function loginUrl() {
  const params = new URLSearchParams({
    client_id: DISCORD_CLIENT_ID,
    redirect_uri: redirectUri(),
    response_type: 'code',
    scope: 'identify guilds',
  });
  return `https://discord.com/oauth2/authorize?${params.toString()}`;
}

function inviteUrl(guildId) {
  const params = new URLSearchParams({
    client_id: DISCORD_CLIENT_ID,
    scope: 'bot applications.commands',
    permissions: '8', // Administrator — der Bot verwaltet Rollen, Kanäle, Nachrichten usw. umfassend
    guild_id: guildId,
    disable_guild_select: 'true',
  });
  return `https://discord.com/oauth2/authorize?${params.toString()}`;
}

async function api(resource, { guild, target, search, method = 'GET', body } = {}) {
  const params = new URLSearchParams({ resource });
  if (guild) params.set('guild', guild);
  if (target) params.set('target', target);
  if (search) params.set('search', search);
  const res = await fetch(`/api/bot?${params.toString()}`, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Fehler (${res.status})`);
  return data;
}

function avatarUrl(user) {
  if (!user.avatar) return null;
  return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64`;
}
function guildIconUrl(g) {
  if (!g.icon) return null;
  if (g.icon.startsWith('http')) return g.icon;
  return `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=64`;
}

// ------------------------------- Views --------------------------------

function renderLoginScreen() {
  const params = new URLSearchParams(location.search);
  const showError = params.get('login_error');
  app.innerHTML = '';
  app.appendChild(el(`
    <div class="center-screen">
      <div class="logo">POLIZEI SYSTEM</div>
      <h1>Düsseldorf RP Dashboard</h1>
      <p style="color:var(--text-dim); max-width:360px;">Melde dich mit Discord an, um die Server zu verwalten, auf denen du Admin- oder Owner-Rechte hast.</p>
      ${showError ? '<div class="error-box">Login fehlgeschlagen. Bitte erneut versuchen.</div>' : ''}
      <a class="btn" href="${loginUrl()}">Mit Discord anmelden</a>
    </div>
  `));
}

function renderTopbar(container) {
  const bar = el(`
    <header class="topbar">
      <div class="brand" id="brand-home">POLIZEI SYSTEM</div>
      <div class="user-chip">
        ${avatarUrl(state.user) ? `<img src="${avatarUrl(state.user)}" />` : ''}
        <span>${state.user.name}</span>
        <button class="btn secondary small" id="logout-btn">Abmelden</button>
      </div>
    </header>
  `);
  bar.querySelector('#brand-home').onclick = () => { state.currentGuild = null; renderGuildPicker(); };
  bar.querySelector('#logout-btn').onclick = async () => {
    await api('logout');
    location.reload();
  };
  container.appendChild(bar);
}

async function renderGuildPicker() {
  app.innerHTML = '';
  renderTopbar(app);
  const main = el('<main></main>');
  main.appendChild(el('<h1>Deine Server</h1>'));
  main.appendChild(el('<p style="color:var(--text-dim)">Server, auf denen der Bot ist und du Admin-Rechte hast, kannst du direkt verwalten.</p>'));
  const grid = el('<div class="guild-grid"></div>');
  main.appendChild(grid);
  const inviteSection = el('<div></div>');
  main.appendChild(inviteSection);
  app.appendChild(main);

  grid.innerHTML = '<div class="loading">Lade Server …</div>';
  try {
    const { managed, unmanaged } = await api('guilds');
    state.guilds = managed;
    grid.innerHTML = '';
    if (managed.length === 0) {
      grid.appendChild(el('<div class="loading">Keine passenden Server gefunden.</div>'));
    }
    for (const g of managed) {
      const icon = guildIconUrl(g);
      const card = el(`
        <div class="guild-card">
          ${icon ? `<img src="${icon}" />` : `<div class="fallback-icon">${g.name.slice(0,1).toUpperCase()}</div>`}
          <div class="meta">
            <div class="name">${g.name}</div>
            <div class="sub">${g.member_count ?? '?'} Mitglieder</div>
          </div>
        </div>
      `);
      card.onclick = () => openGuild(g.id);
      grid.appendChild(card);
    }

    if (unmanaged.length > 0) {
      inviteSection.appendChild(el('<div class="section-title">Deine Server ohne Bot</div>'));
      for (const g of unmanaged) {
        const icon = guildIconUrl(g);
        const card = el(`
          <div class="invite-card">
            <div class="left">
              ${icon ? `<img src="${icon}" style="width:36px;height:36px;border-radius:50%;" />` : `<div class="fallback-icon">${g.name.slice(0,1).toUpperCase()}</div>`}
              <div class="name">${g.name}</div>
            </div>
            <a class="btn small" target="_blank" rel="noopener" href="${inviteUrl(g.id)}">Bot einladen</a>
          </div>
        `);
        inviteSection.appendChild(card);
        inviteSection.appendChild(el('<div style="height:8px"></div>'));
      }
    }
  } catch (e) {
    grid.innerHTML = `<div class="error-box">${e.message}</div>`;
  }
}

async function openGuild(guildId) {
  state.currentGuild = guildId;
  state.tier = state.guilds.find((g) => g.id === guildId) || null;
  state.activeCategory = null;
  await renderGuildDashboard();
}

async function renderGuildDashboard() {
  app.innerHTML = '';
  renderTopbar(app);
  const main = el('<main></main>');
  main.appendChild(el('<div class="loading">Lade Server-Daten …</div>'));
  app.appendChild(main);

  const tier = state.tier || {};
  try {
    const calls = [];
    if (tier.admin) {
      calls.push(
        api('schema', { guild: state.currentGuild }).then((r) => (state.schema = r.categories)),
        api('config', { guild: state.currentGuild }).then((r) => (state.config = r.config)),
        api('channels', { guild: state.currentGuild }).then((r) => (state.channels = r.channels)),
        api('roles', { guild: state.currentGuild }).then((r) => (state.roles = r.roles)),
        api('stats', { guild: state.currentGuild }).then((r) => (state.stats = r))
      );
    }
    await Promise.all(calls);
    state.activeCategory = tier.admin ? (state.schema[0]?.id ?? null) : 'personalakte_eigene';
    if (!tier.admin && (tier.staff || tier.dienstaufsicht)) state.activeCategory = 'personalakten';
    else if (!tier.admin && tier.officer) state.activeCategory = 'personalakte_eigene';
    drawDashboard(main);
  } catch (e) {
    main.innerHTML = `<div class="error-box">${e.message}</div>`;
  }
}

function drawDashboard(main) {
  main.innerHTML = '';
  const tier = state.tier || {};
  const s = state.stats;

  if (tier.admin && s) {
    const pct = s.config_gesamt ? Math.round((s.config_gesetzt / s.config_gesamt) * 100) : 0;
    main.appendChild(el(`
      <div class="stats-panel">
        <h2>${s.icon ? `<img src="${s.icon}" />` : ''} ${s.name}</h2>
        <div class="stat-row">
          <div class="stat"><div class="n">${s.member_count}</div><div class="l">Mitglieder</div></div>
          <div class="stat"><div class="n">${s.channel_count}</div><div class="l">Channels</div></div>
          <div class="stat"><div class="n">${s.role_count}</div><div class="l">Rollen</div></div>
          <div class="stat"><div class="n">${s.dienstnummern_vergeben}</div><div class="l">Dienstnummern</div></div>
          <div class="stat"><div class="n">${s.config_gesetzt}/${s.config_gesamt}</div><div class="l">Konfiguriert</div></div>
        </div>
        <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
      </div>
    `));
  } else {
    main.appendChild(el(`<div class="stats-panel"><h2>${state.tier?.name ?? 'Server'}</h2></div>`));
  }

  const layout = el('<div class="layout"></div>');
  const nav = el('<nav class="categories"></nav>');

  const navButton = (label, id) => {
    const btn = el(`<button>${label}</button>`);
    if (state.activeCategory === id) btn.classList.add('active');
    btn.onclick = () => { state.activeCategory = id; drawDashboard(main); };
    nav.appendChild(btn);
  };

  if (tier.admin) {
    for (const kat of state.schema) navButton(kat.label, kat.id);
    navButton('📋 Bewerbungsfragen', '_bewerbungsfragen');
  }
  if (tier.admin || tier.staff || tier.dienstaufsicht) {
    navButton('👮 Personalakten', 'personalakten');
  } else if (tier.officer) {
    navButton('📁 Meine Akte', 'personalakte_eigene');
  }
  navButton('🧑 Bürgerakten', 'buergerakten');
  layout.appendChild(nav);

  const contentWrap = el('<div></div>');
  layout.appendChild(contentWrap);
  main.appendChild(layout);

  if (state.activeCategory === '_bewerbungsfragen') {
    contentWrap.innerHTML = '<div class="loading">Lade Fragen …</div>';
    renderBewerbungsfragenPanel(contentWrap);
  } else if (state.activeCategory === 'personalakten') {
    contentWrap.innerHTML = '<div class="loading">Lade Personalakten …</div>';
    renderPersonalaktenListe(contentWrap);
  } else if (state.activeCategory === 'personalakte_eigene') {
    contentWrap.innerHTML = '<div class="loading">Lade deine Akte …</div>';
    renderPersonalakteDetail(contentWrap, state.user.id);
  } else if (state.activeCategory && state.activeCategory.startsWith('personalakte:')) {
    contentWrap.innerHTML = '<div class="loading">Lade Akte …</div>';
    renderPersonalakteDetail(contentWrap, state.activeCategory.split(':')[1]);
  } else if (state.activeCategory === 'buergerakten') {
    contentWrap.innerHTML = '<div class="loading">Lade Bürgerakten …</div>';
    renderBuergerakten(contentWrap);
  } else if (state.activeCategory && state.activeCategory.startsWith('buergerakte:')) {
    contentWrap.innerHTML = '<div class="loading">Lade Bürgerakte …</div>';
    renderBuergerakteDetail(contentWrap, state.activeCategory.split(':')[1]);
  } else {
    const kategorie = state.schema?.find((k) => k.id === state.activeCategory);
    if (kategorie) contentWrap.appendChild(renderCategoryPanel(kategorie));
  }
}

async function renderBewerbungsfragenPanel(container) {
  try {
    const { arten } = await api('bewerbungsfragen', { guild: state.currentGuild });
    container.innerHTML = '';
    for (const art of arten) {
      const panel = el(`
        <div class="content-panel" style="margin-bottom:16px;">
          <h2>${art.label}</h2>
          <div class="hint" style="margin-bottom:10px;">${art.beschreibung} — eine Frage pro Zeile. Zeilen hinzufügen, löschen oder verschieben = Fragen hinzufügen/löschen/umsortieren.</div>
          <textarea style="min-height:220px;">${art.fragen.join('\n')}</textarea>
          <div class="field-actions">
            <button class="btn small save-bf">Speichern</button>
            ${!art.ist_standard ? '<button class="btn secondary small reset-bf">Auf Standard zurücksetzen</button>' : ''}
            <span class="save-status"></span>
          </div>
          ${art.ist_standard ? '<div class="hint">Zeigt aktuell die Standardfragen.</div>' : '<div class="hint" style="color:var(--amber)">Eigene Fragen aktiv.</div>'}
        </div>
      `);
      const textarea = panel.querySelector('textarea');
      const status = panel.querySelector('.save-status');
      panel.querySelector('.save-bf').onclick = async () => {
        const fragen = textarea.value.split('\n').map((z) => z.trim()).filter(Boolean);
        setStatus(status, 'Speichere …');
        try {
          await api('bewerbungsfragen', { guild: state.currentGuild, method: 'POST', body: { art: art.art, fragen } });
          setStatus(status, 'Gespeichert ✓', 'ok');
          setTimeout(() => renderBewerbungsfragenPanel(container), 600);
        } catch (e) {
          setStatus(status, e.message, 'err');
        }
      };
      const resetBtn = panel.querySelector('.reset-bf');
      if (resetBtn) {
        resetBtn.onclick = async () => {
          setStatus(status, 'Setze zurück …');
          try {
            await api('bewerbungsfragen', { guild: state.currentGuild, method: 'POST', body: { art: art.art, reset: true } });
            renderBewerbungsfragenPanel(container);
          } catch (e) {
            setStatus(status, e.message, 'err');
          }
        };
      }
      container.appendChild(panel);
    }
  } catch (e) {
    container.innerHTML = `<div class="error-box">${e.message}</div>`;
  }
}

function channelOptions(kind) {
  const typMap = { channel: 'channel', category: 'category', forum: 'forum' };
  const typ = typMap[kind];
  return state.channels
    .filter((c) => c.type === typ)
    .sort((a, b) => a.position - b.position);
}

// ------------------------------- Personalakten --------------------------

async function renderPersonalaktenListe(container) {
  try {
    const { personal } = await api('personalakten', { guild: state.currentGuild });
    container.innerHTML = '';
    const panel = el('<div class="content-panel"><h2>👮 Personalakten</h2></div>');
    if (personal.length === 0) {
      panel.appendChild(el('<div class="hint">Noch keine Dienstnummern vergeben.</div>'));
    }
    for (const p of personal) {
      const row = el(`
        <div class="field" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:600;">${p.name} ${p.dienstnummer ? `<span class="hint">#${p.dienstnummer}</span>` : ''}</div>
            <div class="hint">${p.eintraege_gesamt} Eintra${p.eintraege_gesamt === 1 ? 'g' : 'ege'} · ${p.aktive_verwarnungen} aktive Verwarnung(en)${p.suspendiert ? ' · suspendiert' : ''}</div>
          </div>
          <span style="color:var(--amber)">→</span>
        </div>
      `);
      row.onclick = () => {
        state.activeCategory = `personalakte:${p.user_id}`;
        drawDashboard(document.querySelector('main'));
      };
      panel.appendChild(row);
    }
    container.appendChild(panel);
  } catch (e) {
    container.innerHTML = `<div class="error-box">${e.message}</div>`;
  }
}

async function renderPersonalakteDetail(container, userId) {
  try {
    const akte = await api('personalakte', { guild: state.currentGuild, target: userId });
    container.innerHTML = '';
    const tier = state.tier || {};
    const kannHandeln = tier.admin || tier.staff;
    const kannWiderrufen = tier.admin ? false : tier.dienstaufsicht; // Dienstaufsicht bewusst ohne Admin-Bypass, wie im Bot

    const panel = el(`<div class="content-panel"><h2>📁 ${akte.name}</h2>${akte.dienstnummer ? `<div class="hint">Dienstnummer #${akte.dienstnummer}</div>` : ''}</div>`);

    if (kannHandeln) {
      const form = el(`
        <div class="field">
          <label>Kündigen</label>
          <div class="desc">Trägt eine Kündigung ein, entfernt die Mitglieds-/Warn-Rollen und vergibt die Suspendierungs-Rolle.</div>
          <textarea placeholder="Grund der Kündigung" style="min-height:70px;"></textarea>
          <div class="field-actions">
            <button class="btn small" style="background:var(--err); color:#fff;">Kündigen</button>
            <span class="save-status"></span>
          </div>
        </div>
      `);
      const textarea = form.querySelector('textarea');
      const status = form.querySelector('.save-status');
      form.querySelector('button').onclick = async () => {
        const grund = textarea.value.trim();
        if (!grund) { setStatus(status, 'Grund fehlt', 'err'); return; }
        if (!confirm(`${akte.name} wirklich kündigen?`)) return;
        setStatus(status, 'Speichere …');
        try {
          await api('personalakte_kuendigen', { guild: state.currentGuild, target: userId, method: 'POST', body: { grund } });
          setStatus(status, 'Gekündigt ✓', 'ok');
          setTimeout(() => renderPersonalakteDetail(container, userId), 700);
        } catch (e) {
          setStatus(status, e.message, 'err');
        }
      };
      panel.appendChild(form);
    }

    if (akte.eintraege.length === 0) {
      panel.appendChild(el('<div class="hint" style="margin-top:14px;">Diese Personalakte ist leer.</div>'));
    }
    for (const e of akte.eintraege) {
      const zeit = new Date(e.zeitpunkt).toLocaleString('de-DE');
      const row = el(`
        <div class="field">
          <div style="display:flex; justify-content:space-between; gap:10px;">
            <div>
              <strong>${e.label}</strong>${e.kategorie ? ` · ${e.kategorie}` : ''}${e.widerrufen ? ' <span class="hint">(zurückgenommen)</span>' : ''}
              <div class="hint">${zeit} · ${e.aktenzeichen || ''}</div>
              <div style="margin-top:4px;">${e.grund}</div>
            </div>
          </div>
          <div class="field-actions"></div>
        </div>
      `);
      const actions = row.querySelector('.field-actions');
      if (kannWiderrufen && !e.widerrufen && (e.typ === 'verwarnung' || e.typ === 'suspendierung')) {
        const btn = el('<button class="btn secondary small">Widerrufen</button>');
        const status = el('<span class="save-status"></span>');
        btn.onclick = async () => {
          setStatus(status, 'Speichere …');
          try {
            await api('personalakte_widerruf', { guild: state.currentGuild, target: userId, method: 'POST', body: { aktenzeichen: e.aktenzeichen } });
            renderPersonalakteDetail(container, userId);
          } catch (err) {
            setStatus(status, err.message, 'err');
          }
        };
        actions.appendChild(btn);
        actions.appendChild(status);
      }
      if (kannWiderrufen) {
        const delBtn = el('<button class="btn secondary small" style="border-color:var(--err); color:var(--err);">Löschen</button>');
        delBtn.onclick = async () => {
          if (!confirm('Diesen Eintrag endgültig löschen? Das kann nicht rückgängig gemacht werden.')) return;
          try {
            await api('personalakte_loeschen', { guild: state.currentGuild, target: userId, method: 'POST', body: { aktenzeichen: e.aktenzeichen } });
            renderPersonalakteDetail(container, userId);
          } catch (err) {
            alert(err.message);
          }
        };
        actions.appendChild(delBtn);
      }
      panel.appendChild(row);
    }
    container.appendChild(panel);
  } catch (e) {
    container.innerHTML = `<div class="error-box">${e.message}</div>`;
  }
}

// ------------------------------- Bürgerakten -----------------------------

async function renderBuergerakten(container) {
  container.innerHTML = '';
  const panel = el(`
    <div class="content-panel">
      <h2>🧑 Bürgerakten</h2>
      <div class="field">
        <input type="text" placeholder="Roblox-Name suchen …" id="ba-search" />
      </div>
      <div id="ba-liste"></div>
      <div class="field" style="margin-top:22px;">
        <label>Neue Bürgerakte / Eintrag hinzufügen</label>
        <div class="desc">Existiert noch keine Akte für diesen Namen, wird automatisch eine neue angelegt.</div>
        <input type="text" placeholder="Roblox-Name" id="ba-name" style="margin-bottom:8px;" />
        <textarea placeholder="Eintrag (z. B. Vorfall, Notiz) — optional" id="ba-text" style="min-height:80px;"></textarea>
        <div class="field-actions">
          <button class="btn small" id="ba-anlegen">Speichern</button>
          <span class="save-status" id="ba-status"></span>
        </div>
      </div>
    </div>
  `);
  container.appendChild(panel);

  const liste = panel.querySelector('#ba-liste');
  async function suchen(query) {
    liste.innerHTML = '<div class="hint">Lade …</div>';
    try {
      const { buergerakten } = await api('buergerakten', { guild: state.currentGuild, search: query });
      liste.innerHTML = '';
      if (buergerakten.length === 0) {
        liste.appendChild(el('<div class="hint">Keine Bürgerakten gefunden.</div>'));
      }
      for (const b of buergerakten) {
        const row = el(`
          <div class="field" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
            <div style="font-weight:600;">${b.roblox_name}</div>
            <div class="hint">${b.eintraege_anzahl} Eintra${b.eintraege_anzahl === 1 ? 'g' : 'ege'} →</div>
          </div>
        `);
        row.onclick = () => {
          state.activeCategory = `buergerakte:${b.roblox_user_id}`;
          drawDashboard(document.querySelector('main'));
        };
        liste.appendChild(row);
      }
    } catch (e) {
      liste.innerHTML = `<div class="error-box">${e.message}</div>`;
    }
  }
  suchen('');
  let timer = null;
  panel.querySelector('#ba-search').oninput = (ev) => {
    clearTimeout(timer);
    timer = setTimeout(() => suchen(ev.target.value), 400);
  };

  const status = panel.querySelector('#ba-status');
  panel.querySelector('#ba-anlegen').onclick = async () => {
    const roblox_name = panel.querySelector('#ba-name').value.trim();
    const text = panel.querySelector('#ba-text').value.trim();
    if (!roblox_name) { setStatus(status, 'Roblox-Name fehlt', 'err'); return; }
    setStatus(status, 'Speichere …');
    try {
      const res = await api('buergerakten', { guild: state.currentGuild, method: 'POST', body: { roblox_name, text } });
      setStatus(status, 'Gespeichert ✓', 'ok');
      panel.querySelector('#ba-name').value = '';
      panel.querySelector('#ba-text').value = '';
      suchen('');
    } catch (e) {
      setStatus(status, e.message, 'err');
    }
  };
}

async function renderBuergerakteDetail(container, robloxId) {
  try {
    const params = new URLSearchParams({ resource: 'buergerakte', guild: state.currentGuild, roblox_id: robloxId });
    const res = await fetch(`/api/bot?${params.toString()}`);
    const akte = await res.json();
    if (!res.ok) throw new Error(akte.error || 'Fehler');
    container.innerHTML = '';
    const panel = el(`
      <div class="content-panel">
        <h2>🧑 ${akte.roblox_name}</h2>
        <div class="hint">Roblox-ID ${akte.roblox_user_id}</div>
      </div>
    `);
    if (akte.eintraege.length === 0) {
      panel.appendChild(el('<div class="hint" style="margin-top:14px;">Noch keine Einträge.</div>'));
    }
    for (const e of akte.eintraege) {
      const zeit = new Date(e.zeitpunkt).toLocaleString('de-DE');
      panel.appendChild(el(`
        <div class="field">
          <div class="hint">${zeit}</div>
          <div style="margin-top:4px;">${e.text}</div>
        </div>
      `));
    }
    container.appendChild(panel);
  } catch (e) {
    container.innerHTML = `<div class="error-box">${e.message}</div>`;
  }
}

function renderCategoryPanel(kategorie) {
  const panel = el(`
    <div class="content-panel">
      <h2>${kategorie.label}</h2>
    </div>
  `);

  for (const item of kategorie.items) {
    panel.appendChild(renderSelectField(item));
  }
  for (const item of kategorie.text_items) {
    panel.appendChild(renderTextField(item));
  }
  if (kategorie.items.length === 0 && kategorie.text_items.length === 0) {
    panel.appendChild(el('<div class="hint">Für diesen Bereich gibt es nichts einzustellen.</div>'));
  }
  return panel;
}

function statusEl() {
  return el('<span class="save-status"></span>');
}
function setStatus(node, text, kind) {
  node.textContent = text;
  node.className = 'save-status' + (kind ? ' ' + kind : '');
}

async function saveConfig(key, value, statusNode) {
  setStatus(statusNode, 'Speichere …');
  try {
    const res = await api('config', { guild: state.currentGuild, method: 'POST', body: { key, value } });
    state.config = res.config;
    setStatus(statusNode, 'Gespeichert ✓', 'ok');
    setTimeout(() => setStatus(statusNode, ''), 2000);
  } catch (e) {
    setStatus(statusNode, e.message, 'err');
  }
}

function renderSelectField(item) {
  const wrap = el(`
    <div class="field">
      <label>${item.label}</label>
    </div>
  `);

  if (item.kind === 'role_list') {
    const current = new Set((state.config[item.key] || []).map(String));
    const list = el('<div class="role-list"></div>');
    for (const r of state.roles) {
      const chip = el(`<div class="role-chip${current.has(r.id) ? ' active' : ''}">${r.name}</div>`);
      chip.onclick = () => {
        if (current.has(r.id)) current.delete(r.id); else current.add(r.id);
        chip.classList.toggle('active');
        saveConfig(item.key, Array.from(current), status);
      };
      list.appendChild(chip);
    }
    wrap.appendChild(list);
    const status = statusEl();
    wrap.appendChild(status);
    return wrap;
  }

  const select = el('<select></select>');
  select.appendChild(el(`<option value="">— nicht gesetzt —</option>`));
  const options = item.kind === 'role' ? state.roles : channelOptions(item.kind);
  const currentVal = state.config[item.key] ? String(state.config[item.key]) : '';
  for (const o of options) {
    const opt = el(`<option value="${o.id}">${o.name}</option>`);
    if (o.id === currentVal) opt.selected = true;
    select.appendChild(opt);
  }
  const status = statusEl();
  select.onchange = () => saveConfig(item.key, select.value || null, status);
  wrap.appendChild(select);
  wrap.appendChild(status);
  return wrap;
}

function renderTextField(item) {
  const wrap = el(`
    <div class="field">
      <label>${item.label}</label>
      <div class="desc">${item.beschreibung}</div>
    </div>
  `);
  const currentVal = state.config[item.key] ?? '';
  const input = item.long_text ? el('<textarea></textarea>') : el('<input type="text" />');
  input.value = currentVal;
  const status = statusEl();
  let timer = null;
  input.oninput = () => {
    clearTimeout(timer);
    setStatus(status, 'Tippen …');
    timer = setTimeout(() => saveConfig(item.key, input.value, status), 700);
  };
  wrap.appendChild(input);
  wrap.appendChild(status);
  return wrap;
}

// ------------------------------- Boot ----------------------------------

async function boot() {
  app.innerHTML = '<div class="loading">Lade …</div>';
  try {
    const me = await api('me');
    state.user = me.user;
    renderGuildPicker();
  } catch {
    renderLoginScreen();
  }
}
boot();
