<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polizei System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070a10;
    --bg-grid: rgba(91,140,255,0.045);
    --panel: #0e131d;
    --panel-2: #131a26;
    --panel-3: #182131;
    --border: #232e40;
    --border-soft: #1a222f;

    --accent: #5b8cff;
    --accent-2: #8f6bff;
    --accent-soft: rgba(91,140,255,0.14);
    --accent-strong: #9db8ff;

    --text: #e9edf7;
    --text-dim: #8b96ab;
    --text-faint: #576079;

    --ok: #34d399;
    --ok-soft: rgba(52,211,153,0.14);
    --warn: #f5a623;
    --warn-soft: rgba(245,166,35,0.14);
    --err: #f4586b;
    --err-soft: rgba(244,88,107,0.14);
    --purple: #b98bff;
    --purple-soft: rgba(185,139,255,0.14);

    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 10px 30px -14px rgba(0,0,0,0.55);
    font-family: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    background-image:
      radial-gradient(700px 400px at 15% -10%, rgba(91,140,255,0.09), transparent 60%),
      radial-gradient(600px 380px at 100% 0%, rgba(185,139,255,0.06), transparent 55%),
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: auto, auto, 34px 34px, 34px 34px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-strong); }
  ::selection { background: var(--accent-soft); color: var(--accent-strong); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------------------------- Login ---------------------------- */
  .center-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    padding: 20px;
    text-align: center;
  }
  .badge-mark {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: linear-gradient(155deg, var(--panel-3), var(--panel));
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 19px;
    color: var(--accent-strong);
    box-shadow: 0 0 0 1px rgba(91,140,255,0.08), 0 16px 34px -14px rgba(91,140,255,0.35);
  }
  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  h1 { font-size: 24px; margin: 0; font-weight: 800; letter-spacing: -0.015em; }
  .lede { color: var(--text-dim); max-width: 380px; font-size: 14px; line-height: 1.6; margin: 0; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--accent), #4d7dff);
    color: #06101f;
    border: none;
    padding: 11px 20px;
    border-radius: var(--radius-sm);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    transition: filter .12s, transform .12s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.secondary:hover { background: var(--panel-3); }
  .btn.danger { background: linear-gradient(135deg, var(--err), #d43a52); color: #1a0508; }
  .btn.purple { background: linear-gradient(135deg, var(--purple), #8a5cff); color: #14071f; }
  .btn.small { padding: 7px 13px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
  .error-box {
    border: 1px solid rgba(244,88,107,0.35);
    background: var(--err-soft);
    color: #ff97a4;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    max-width: 420px;
  }

  /* --------------------------- Topbar ----------------------------- */
  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 22px;
    border-bottom: 1px solid var(--border-soft);
    background: rgba(14,19,29,0.85);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 5;
    flex-wrap: wrap;
  }
  header.topbar .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 1.5px;
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
  }
  header.topbar .brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .user-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .user-chip img { width: 27px; height: 27px; border-radius: 50%; border: 1px solid var(--border); }
  main { max-width: 1200px; margin: 0 auto; padding: 26px 18px 90px; }

  /* ------------------------- Guild picker -------------------------- */
  .page-heading { display: flex; flex-direction: column; gap: 4px; margin-bottom: 22px; }
  .page-heading h1 { font-size: 21px; }
  .page-heading p { color: var(--text-dim); font-size: 13.5px; margin: 0; }

  .guild-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .guild-card {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color .15s, transform .15s, background .15s, box-shadow .15s;
  }
  .guild-card:hover { border-color: rgba(91,140,255,0.4); background: var(--panel-2); transform: translateY(-2px); box-shadow: var(--shadow); }
  .guild-card img, .guild-card .fallback-icon {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    background: var(--panel-3);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--accent-strong);
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid var(--border);
  }
  .guild-card .meta { min-width: 0; }
  .guild-card .name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .guild-card .sub { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
  .section-title {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-faint);
    margin: 34px 0 10px;
    font-weight: 700;
  }
  .invite-card {
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 14px 15px;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: space-between;
  }
  .invite-card .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .invite-card .name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .invite-card + .invite-card { margin-top: 8px; }

  /* ---------------------------- Stats ------------------------------ */
  .stats-panel {
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .stats-panel h2 { margin: 0 0 14px; font-size: 15.5px; display: flex; align-items: center; gap: 10px; font-weight: 800; }
  .stats-panel h2 img { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); }
  .stat-row { display: flex; flex-wrap: wrap; gap: 26px; }
  .stat { min-width: 84px; }
  .stat .n { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: var(--accent-strong); font-weight: 700; }
  .stat .l { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .6px; margin-top: 2px; }
  .progress-bar { height: 5px; background: var(--panel-3); border-radius: 3px; overflow: hidden; margin-top: 14px; }
  .progress-bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); }

  /* ------------------------ Kategorie-Leiste (statt Sidebar) ------------------------ */
  /* Behebt das "muss scrollen"-Problem: horizontale, umbrechende Chip-Leiste
     statt einer langen vertikalen Sidebar-Liste. */
  nav.categories {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  nav.categories button {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border-soft);
    color: var(--text-dim);
    padding: 9px 15px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 999px;
    transition: border-color .12s, color .12s, background .12s;
  }
  nav.categories button:hover { border-color: rgba(91,140,255,0.35); color: var(--text); }
  nav.categories button.active {
    background: linear-gradient(135deg, var(--accent-soft), rgba(185,139,255,0.12));
    border-color: rgba(91,140,255,0.45);
    color: var(--accent-strong);
  }
  nav.categories button.admin-tab.active,
  nav.categories button.admin-tab:hover { border-color: rgba(185,139,255,0.5); color: var(--purple); }

  .content-panel {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
  }
  .content-panel h2 { margin: 0 0 4px; font-size: 16.5px; font-weight: 800; }
  .content-panel + .content-panel { margin-top: 16px; }

  /* Config-Felder als Grid-Karten statt einer langen vertikalen Liste —
     das ist der Kern der Scroll-Fix: mehrere Felder nebeneinander sichtbar. */
  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
    margin-top: 16px;
  }
  .field-card {
    background: var(--panel-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .field-card.wide { grid-column: 1 / -1; }
  .field-card label { display: block; font-size: 13px; font-weight: 700; }
  .field-card .desc { font-size: 12px; color: var(--text-dim); margin: -4px 0 2px; }

  .field { margin-top: 16px; }
  .field:first-of-type { margin-top: 0; }
  .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .field .desc { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }

  select, input[type=text], input[type=search], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 11px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-family: inherit;
  }
  textarea { min-height: 110px; resize: vertical; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .role-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .role-chip {
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    color: var(--text-dim);
    transition: border-color .12s, color .12s, background .12s;
  }
  .role-chip.active { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
  .field-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .save-status { font-size: 12px; color: var(--text-dim); }
  .save-status.ok { color: var(--ok); }
  .save-status.err { color: var(--err); }
  .loading { color: var(--text-dim); padding: 40px; text-align: center; font-size: 13.5px; }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  /* ----------------------- Badges / status ------------------------- */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; padding: 3px 9px;
    border-radius: 20px; text-transform: uppercase; letter-spacing: .3px;
  }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.err { background: var(--err-soft); color: #ff97a4; }
  .badge.purple { background: var(--purple-soft); color: var(--purple); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .status-dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .status-dot.err { background: var(--err); box-shadow: 0 0 6px var(--err); }
  .status-dot.warn { background: var(--warn); box-shadow: 0 0 6px var(--warn); }

  .entry-row { border-left: 3px solid var(--border); padding-left: 14px !important; margin-left: -3px; }
  .entry-row[data-typ="kuendigung"] { border-left-color: var(--err); }
  .entry-row[data-typ="verwarnung"] { border-left-color: var(--warn); }
  .entry-row[data-typ="suspendierung"] { border-left-color: #ff8a3d; }
  .entry-row[data-typ="sonstiges"] { border-left-color: var(--text-faint); }

  /* --------------------------- Bürgerakten -------------------------- */
  .buerger-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 4px; cursor: pointer; border-radius: var(--radius-sm);
  }
  .buerger-row:hover { background: var(--panel-2); }
  .avatar-sm { width: 36px; height: 36px; border-radius: 8px; background: var(--panel-3); border: 1px solid var(--border); object-fit: cover; flex-shrink: 0; }
  .avatar-lg { width: 96px; height: 96px; border-radius: 12px; background: var(--panel-3); border: 1px solid var(--border); object-fit: cover; }
  .rblx-suggest {
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    margin-top: 6px;
    overflow: hidden;
    background: var(--bg);
  }
  .rblx-suggest .rblx-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; cursor: pointer; font-size: 13px;
  }
  .rblx-suggest .rblx-item:hover { background: var(--panel-2); }
  .rblx-suggest .rblx-item .name { font-weight: 600; }
  .rblx-suggest .rblx-item .uname { color: var(--text-faint); font-size: 11.5px; }

  /* ----------------------------- Admin ------------------------------ */
  .admin-hero {
    background: linear-gradient(150deg, rgba(185,139,255,0.14), rgba(91,140,255,0.06));
    border: 1px solid rgba(185,139,255,0.3);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .admin-hero h2 { margin: 0; font-size: 16px; color: var(--purple); }
  .admin-hero p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-dim); }
  .case-row { border-left: 3px solid var(--border); padding: 10px 0 10px 14px; margin-bottom: 8px; }
  .case-row[data-status="offen"] { border-left-color: var(--warn); }
  .case-row[data-status="in_bearbeitung"] { border-left-color: var(--accent); }
  .case-row[data-status="geschlossen"] { border-left-color: var(--ok); }
  .lock-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border-soft); }
  .lock-row:first-child { border-top: none; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------------------------------------------------------------------
// KONFIGURATION: hier deine Discord-Application-Client-ID eintragen.
// ---------------------------------------------------------------------
const DISCORD_CLIENT_ID = "1528709772784963645";

const app = document.getElementById('app');
const state = {
  user: null, isAdmin: false, guilds: [], currentGuild: null, tier: null,
  schema: null, config: null, channels: [], roles: [], stats: null,
  activeCategory: null,
};

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function redirectUri() {
  return `${location.origin}/api/callback`;
}

function loginUrl() {
  const params = new URLSearchParams({
    client_id: DISCORD_CLIENT_ID,
    redirect_uri: redirectUri(),
    response_type: 'code',
    scope: 'identify guilds',
  });
  return `https://discord.com/oauth2/authorize?${params.toString()}`;
}

function inviteUrl(guildId) {
  const params = new URLSearchParams({
    client_id: DISCORD_CLIENT_ID,
    scope: 'bot applications.commands',
    permissions: '8',
    guild_id: guildId,
    disable_guild_select: 'true',
  });
  return `https://discord.com/oauth2/authorize?${params.toString()}`;
}

async function api(resource, { guild, target, search, method = 'GET', body, extraParams } = {}) {
  const params = new URLSearchParams({ resource });
  if (guild) params.set('guild', guild);
  if (target) params.set('target', target);
  if (search) params.set('search', search);
  if (extraParams) for (const [k, v] of Object.entries(extraParams)) params.set(k, v);
  const res = await fetch(`/api/bot?${params.toString()}`, {
    method,
    credentials: 'include',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Fehler (${res.status})`);
  return data;
}

// Direkter (kein Login/Cookie nötig) Zugriff auf den Roblox-Proxy.
async function robloxApi(action, params, signal) {
  const p = new URLSearchParams({ action, ...params });
  const res = await fetch(`/api/roblox?${p.toString()}`, { signal });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Roblox-API-Fehler');
  return data;
}

function avatarUrl(user) {
  if (!user.avatar) return null;
  return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64`;
}
function guildIconUrl(g) {
  if (!g.icon) return null;
  if (g.icon.startsWith('http')) return g.icon;
  return `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=64`;
}

// ------------------------------- Views --------------------------------

function renderLoginScreen() {
  const params = new URLSearchParams(location.search);
  const showError = params.get('login_error');
  const reason = params.get('reason');
  app.innerHTML = '';
  let errorHtml = '';
  if (showError === 'locked') {
    errorHtml = `<div class="error-box">🚫 Dein Zugriff auf dieses Dashboard wurde gesperrt.${reason ? ` Grund: ${esc(reason)}` : ''}</div>`;
  } else if (showError) {
    errorHtml = '<div class="error-box">Login fehlgeschlagen. Bitte erneut versuchen.</div>';
  }
  app.appendChild(el(`
    <div class="center-screen">
      <div class="badge-mark">PS</div>
      <div class="logo">Polizei System</div>
      <h1>Dienststellen-Dashboard</h1>
      <p class="lede">Melde dich mit Discord an, um die Server zu verwalten, auf denen du Admin- oder Teamrechte hast.</p>
      ${errorHtml}
      <a class="btn" href="${loginUrl()}">Mit Discord anmelden</a>
    </div>
  `));
}

function renderTopbar(container) {
  const bar = el(`
    <header class="topbar">
      <div class="brand" id="brand-home"><span class="dot"></span>Polizei System</div>
      <div class="user-chip">
        ${state.isAdmin ? '<button class="btn purple small" id="admin-btn">🛡 Admin</button>' : ''}
        ${avatarUrl(state.user) ? `<img src="${avatarUrl(state.user)}" />` : ''}
        <span>${esc(state.user.name)}</span>
        <button class="btn secondary small" id="logout-btn">Abmelden</button>
      </div>
    </header>
  `);
  bar.querySelector('#brand-home').onclick = () => { state.currentGuild = null; renderGuildPicker(); };
  bar.querySelector('#logout-btn').onclick = async () => {
    await api('logout');
    location.reload();
  };
  const adminBtn = bar.querySelector('#admin-btn');
  if (adminBtn) adminBtn.onclick = () => renderAdminArea();
  container.appendChild(bar);
}

async function renderGuildPicker() {
  app.innerHTML = '';
  renderTopbar(app);
  const main = el('<main></main>');
  main.appendChild(el(`
    <div class="page-heading">
      <h1>Deine Server</h1>
      <p>Server, auf denen der Bot läuft und du Teamrechte hast, kannst du direkt verwalten.</p>
    </div>
  `));
  const grid = el('<div class="guild-grid"></div>');
  main.appendChild(grid);
  const inviteSection = el('<div></div>');
  main.appendChild(inviteSection);
  app.appendChild(main);

  grid.innerHTML = '<div class="loading">Lade Server …</div>';
  try {
    const { managed, unmanaged } = await api('guilds');
    state.guilds = managed;
    grid.innerHTML = '';
    if (managed.length === 0) {
      grid.appendChild(el('<div class="loading">Keine passenden Server gefunden.</div>'));
    }
    for (const g of managed) {
      const icon = guildIconUrl(g);
      const card = el(`
        <div class="guild-card">
          ${icon ? `<img src="${icon}" />` : `<div class="fallback-icon">${esc(g.name.slice(0,1).toUpperCase())}</div>`}
          <div class="meta">
            <div class="name">${esc(g.name)}</div>
            <div class="sub">${g.member_count ?? '?'} Mitglieder</div>
          </div>
        </div>
      `);
      card.onclick = () => openGuild(g.id);
      grid.appendChild(card);
    }

    if (unmanaged.length > 0) {
      inviteSection.appendChild(el('<div class="section-title">Deine Server ohne Bot</div>'));
      for (const g of unmanaged) {
        const icon = guildIconUrl(g);
        const card = el(`
          <div class="invite-card">
            <div class="left">
              ${icon ? `<img src="${icon}" style="width:36px;height:36px;border-radius:8px;" />` : `<div class="fallback-icon">${esc(g.name.slice(0,1).toUpperCase())}</div>`}
              <div class="name">${esc(g.name)}</div>
            </div>
            <a class="btn small" target="_blank" rel="noopener" href="${inviteUrl(g.id)}">Bot einladen</a>
          </div>
        `);
        inviteSection.appendChild(card);
      }
    }
  } catch (e) {
    grid.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
  }
}

async function openGuild(guildId) {
  state.currentGuild = guildId;
  state.tier = state.guilds.find((g) => g.id === guildId) || null;
  state.activeCategory = null;
  await renderGuildDashboard();
}

async function renderGuildDashboard() {
  app.innerHTML = '';
  renderTopbar(app);
  const main = el('<main></main>');
  main.appendChild(el('<div class="loading">Lade Server-Daten …</div>'));
  app.appendChild(main);

  const tier = state.tier || {};
  try {
    const calls = [];
    if (tier.admin) {
      calls.push(
        api('schema', { guild: state.currentGuild }).then((r) => (state.schema = r.categories)),
        api('config', { guild: state.currentGuild }).then((r) => (state.config = r.config)),
        api('channels', { guild: state.currentGuild }).then((r) => (state.channels = r.channels)),
        api('roles', { guild: state.currentGuild }).then((r) => (state.roles = r.roles)),
        api('stats', { guild: state.currentGuild }).then((r) => (state.stats = r))
      );
    }
    await Promise.all(calls);
    state.activeCategory = tier.admin ? (state.schema[0]?.id ?? null) : 'personalakte_eigene';
    if (!tier.admin && (tier.staff || tier.dienstaufsicht)) state.activeCategory = 'personalakten';
    else if (!tier.admin && tier.officer) state.activeCategory = 'personalakte_eigene';
    drawDashboard(main);
  } catch (e) {
    main.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
  }
}

function drawDashboard(main) {
  main.innerHTML = '';
  const tier = state.tier || {};
  const s = state.stats;

  if (tier.admin && s) {
    const pct = s.config_gesamt ? Math.round((s.config_gesetzt / s.config_gesamt) * 100) : 0;
    main.appendChild(el(`
      <div class="stats-panel">
        <h2>${s.icon ? `<img src="${s.icon}" />` : ''} ${esc(s.name)}</h2>
        <div class="stat-row">
          <div class="stat"><div class="n">${s.member_count}</div><div class="l">Mitglieder</div></div>
          <div class="stat"><div class="n">${s.channel_count}</div><div class="l">Channels</div></div>
          <div class="stat"><div class="n">${s.role_count}</div><div class="l">Rollen</div></div>
          <div class="stat"><div class="n">${s.dienstnummern_vergeben}</div><div class="l">Dienstnummern</div></div>
          <div class="stat"><div class="n">${s.config_gesetzt}/${s.config_gesamt}</div><div class="l">Konfiguriert</div></div>
        </div>
        <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
      </div>
    `));
  } else {
    main.appendChild(el(`<div class="stats-panel"><h2>${esc(state.tier?.name ?? 'Server')}</h2></div>`));
  }

  // Kategorie-Leiste: horizontale, umbrechende Chips statt Sidebar -> kein Scrollen mehr nötig.
  const nav = el('<nav class="categories"></nav>');
  const navButton = (label, id) => {
    const btn = el(`<button>${label}</button>`);
    if (state.activeCategory === id) btn.classList.add('active');
    btn.onclick = () => { state.activeCategory = id; drawDashboard(main); };
    nav.appendChild(btn);
  };

  if (tier.admin) {
    for (const kat of state.schema) navButton(kat.label, kat.id);
    navButton('📋 Bewerbungsfragen', '_bewerbungsfragen');
  }
  if (tier.admin || tier.staff || tier.dienstaufsicht) {
    navButton('👮 Personalakten', 'personalakten');
  } else if (tier.officer) {
    navButton('📁 Meine Akte', 'personalakte_eigene');
  }
  navButton('🧑 Bürgerakten', 'buergerakten');
  main.appendChild(nav);

  const contentWrap = el('<div></div>');
  main.appendChild(contentWrap);

  if (state.activeCategory === '_bewerbungsfragen') {
    contentWrap.innerHTML = '<div class="loading">Lade Fragen …</div>';
    renderBewerbungsfragenPanel(contentWrap);
  } else if (state.activeCategory === 'personalakten') {
    contentWrap.innerHTML = '<div class="loading">Lade Personalakten …</div>';
    renderPersonalaktenListe(contentWrap);
  } else if (state.activeCategory === 'personalakte_eigene') {
    contentWrap.innerHTML = '<div class="loading">Lade deine Akte …</div>';
    renderPersonalakteDetail(contentWrap, state.user.id);
  } else if (state.activeCategory && state.activeCategory.startsWith('personalakte:')) {
    contentWrap.innerHTML = '<div class="loading">Lade Akte …</div>';
    renderPersonalakteDetail(contentWrap, state.activeCategory.split(':')[1]);
  } else if (state.activeCategory === 'buergerakten') {
    contentWrap.innerHTML = '<div class="loading">Lade Bürgerakten …</div>';
    renderBuergerakten(contentWrap);
  } else if (state.activeCategory && state.activeCategory.startsWith('buergerakte:')) {
    contentWrap.innerHTML = '<div class="loading">Lade Bürgerakte …</div>';
    renderBuergerakteDetail(contentWrap, state.activeCategory.split(':')[1]);
  } else {
    const kategorie = state.schema?.find((k) => k.id === state.activeCategory);
    if (kategorie) contentWrap.appendChild(renderCategoryPanel(kategorie));
  }
}

async function renderBewerbungsfragenPanel(container) {
  try {
    const { arten } = await api('bewerbungsfragen', { guild: state.currentGuild });
    container.innerHTML = '';
    for (const art of arten) {
      const panel = el(`
        <div class="content-panel">
          <h2>${esc(art.label)}</h2>
          <div class="hint" style="margin-bottom:10px;">${esc(art.beschreibung)} — eine Frage pro Zeile. Zeilen hinzufügen, löschen oder verschieben = Fragen hinzufügen/löschen/umsortieren.</div>
          <textarea style="min-height:220px;">${esc(art.fragen.join('\n'))}</textarea>
          <div class="field-actions">
            <button class="btn small save-bf">Speichern</button>
            ${!art.ist_standard ? '<button class="btn secondary small reset-bf">Auf Standard zurücksetzen</button>' : ''}
            <span class="save-status"></span>
          </div>
          ${art.ist_standard ? '<div class="hint">Zeigt aktuell die Standardfragen.</div>' : '<div class="badge warn" style="margin-top:8px;">Eigene Fragen aktiv</div>'}
        </div>
      `);
      const textarea = panel.querySelector('textarea');
      const status = panel.querySelector('.save-status');
      panel.querySelector('.save-bf').onclick = async () => {
        const fragen = textarea.value.split('\n').map((z) => z.trim()).filter(Boolean);
        setStatus(status, 'Speichere …');
        try {
          await api('bewerbungsfragen', { guild: state.currentGuild, method: 'POST', body: { art: art.art, fragen } });
          setStatus(status, 'Gespeichert ✓', 'ok');
          setTimeout(() => renderBewerbungsfragenPanel(container), 600);
        } catch (e) {
          setStatus(status, e.message, 'err');
        }
      };
      const resetBtn = panel.querySelector('.reset-bf');
      if (resetBtn) {
        resetBtn.onclick = async () => {
          setStatus(status, 'Setze zurück …');
          try {
            await api('bewerbungsfragen', { guild: state.currentGuild, method: 'POST', body: { art: art.art, reset: true } });
            renderBewerbungsfragenPanel(container);
          } catch (e) {
            setStatus(status, e.message, 'err');
          }
        };
      }
      container.appendChild(panel);
    }
  } catch (e) {
    container.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
  }
}

function channelOptions(kind) {
  const typMap = { channel: 'channel', category: 'category', forum: 'forum' };
  const typ = typMap[kind];
  return state.channels
    .filter((c) => c.type === typ)
    .sort((a, b) => a.position - b.position);
}

function renderPersonalakteAktionen(container, userId, akte) {
  const wrap = el(`
    <div class="field">
      <label>Personalakte verwalten</label>
      <div class="role-list" id="pa-tabs" style="margin-bottom:12px;"></div>
      <div id="pa-aktion-body"></div>
    </div>
  `);
  const tabs = wrap.querySelector('#pa-tabs');
  const body = wrap.querySelector('#pa-aktion-body');

  const aktionen = [
    { id: 'verwarnen', label: '⚠️ Verwarnen' },
    { id: 'suspendieren', label: '⏸️ Suspendieren' },
    { id: 'aufheben', label: '✅ Suspendierung aufheben' },
    { id: 'kuendigen', label: '⛔ Kündigen' },
  ];
  let aktiv = 'verwarnen';

  function zeichneTabs() {
    tabs.innerHTML = '';
    for (const a of aktionen) {
      const chip = el(`<div class="role-chip${a.id === aktiv ? ' active' : ''}">${a.label}</div>`);
      chip.onclick = () => { aktiv = a.id; zeichneTabs(); zeichneBody(); };
      tabs.appendChild(chip);
    }
  }

  function zeichneBody() {
    body.innerHTML = '';

    if (aktiv === 'verwarnen') {
      const form = el(`
        <div>
          <div class="desc">Trägt eine Verwarnung ein. Bei der 3. Verwarnung erfolgt automatisch eine Kündigung inkl. Suspendierungs-Rolle.</div>
          <textarea placeholder="Grund der Verwarnung" style="min-height:70px;"></textarea>
          <div class="field-actions">
            <button class="btn small">Verwarnen</button>
            <span class="save-status"></span>
          </div>
        </div>
      `);
      const textarea = form.querySelector('textarea');
      const status = form.querySelector('.save-status');
      form.querySelector('button').onclick = async () => {
        const grund = textarea.value.trim();
        if (!grund) { setStatus(status, 'Grund fehlt', 'err'); return; }
        setStatus(status, 'Speichere …');
        try {
          const res = await api('personalakte_verwarnen', { guild: state.currentGuild, target: userId, method: 'POST', body: { grund } });
          setStatus(status, res.kuendigung ? '3. Verwarnung — automatisch gekündigt ✓' : 'Verwarnt ✓', 'ok');
          setTimeout(() => renderPersonalakteDetail(container, userId), 700);
        } catch (e) {
          setStatus(status, e.message, 'err');
        }
      };
      body.appendChild(form);
    }

    if (aktiv === 'suspendieren') {
      const form = el(`
        <div>
          <div class="desc">Trägt eine Suspendierung ein und entfernt die Polizist-Rolle. Ohne Dauer bleibt sie unbefristet, bis sie manuell aufgehoben wird.</div>
          <textarea placeholder="Grund der Suspendierung" style="min-height:70px; margin-bottom:8px;"></textarea>
          <input type="text" placeholder="Dauer, optional — z. B. 3d, 12h, 2d6h" />
          <div class="field-actions">
            <button class="btn small">Suspendieren</button>
            <span class="save-status"></span>
          </div>
        </div>
      `);
      const textarea = form.querySelector('textarea');
      const dauerInput = form.querySelector('input');
      const status = form.querySelector('.save-status');
      form.querySelector('button').onclick = async () => {
        const grund = textarea.value.trim();
        if (!grund) { setStatus(status, 'Grund fehlt', 'err'); return; }
        setStatus(status, 'Speichere …');
        try {
          const res = await api('personalakte_suspendieren', { guild: state.currentGuild, target: userId, method: 'POST', body: { grund, dauer: dauerInput.value.trim() } });
          setStatus(status, `Suspendiert bis: ${res.bis} ✓`, 'ok');
          setTimeout(() => renderPersonalakteDetail(container, userId), 700);
        } catch (e) {
          setStatus(status, e.message, 'err');
        }
      };
      body.appendChild(form);
    }

    if (aktiv === 'aufheben') {
      const form = el(`
        <div>
          <div class="desc">Beendet eine laufende Suspendierung vorzeitig und gibt die Polizist-Rolle zurück.</div>
          <div class="field-actions">
            <button class="btn secondary small">Suspendierung aufheben</button>
            <span class="save-status"></span>
          </div>
        </div>
      `);
      const status = form.querySelector('.save-status');
      form.querySelector('button').onclick = async () => {
        setStatus(status, 'Speichere …');
        try {
          await api('personalakte_suspendierung_aufheben', { guild: state.currentGuild, target: userId, method: 'POST', body: {} });
          setStatus(status, 'Aufgehoben ✓', 'ok');
          setTimeout(() => renderPersonalakteDetail(container, userId), 700);
        } catch (e) {
          setStatus(status, e.message, 'err');
        }
      };
      body.appendChild(form);
    }

    if (aktiv === 'kuendigen') {
      const form = el(`
        <div>
          <div class="desc">Trägt eine Kündigung ein, entfernt die Mitglieds-/Warn-Rollen und vergibt die Suspendierungs-Rolle.</div>
          <textarea placeholder="Grund der Kündigung" style="min-height:70px;"></textarea>
          <div class="field-actions">
            <button class="btn danger small">Kündigen</button>
            <span class="save-status"></span>
          </div>
        </div>
      `);
      const textarea = form.querySelector('textarea');
      const status = form.querySelector('.save-status');
      form.querySelector('button').onclick = async () => {
        const grund = textarea.value.trim();
        if (!grund) { setStatus(status, 'Grund fehlt', 'err'); return; }
        if (!confirm(`${akte.name} wirklich kündigen?`)) return;
        setStatus(status, 'Speichere …');
        try {
          await api('personalakte_kuendigen', { guild: state.currentGuild, target: userId, method: 'POST', body: { grund } });
          setStatus(status, 'Gekündigt ✓', 'ok');
          setTimeout(() => renderPersonalakteDetail(container, userId), 700);
        } catch (e) {
          setStatus(status, e.message, 'err');
        }
      };
      body.appendChild(form);
    }
  }

  zeichneTabs();
  zeichneBody();
  return wrap;
}

async function renderPersonalakteDetail(container, userId) {
  try {
    const akte = await api('personalakte', { guild: state.currentGuild, target: userId });
    container.innerHTML = '';
    const tier = state.tier || {};
    // HINWEIS: akte.darf_handeln bzw. tier.officer_darf_handeln sind Felder,
    // die vom Bot noch nicht geliefert werden (siehe api/bot.js-Kommentar oben).
    // Sobald der Bot das mitschickt, greifen "normale Polizisten" automatisch
    // mit auf diese Buttons zu, ohne dass hier etwas geändert werden muss.
    const kannHandeln = tier.admin || tier.staff || !!akte.darf_handeln || !!tier.officer_darf_handeln;
    const kannWiderrufen = tier.admin ? false : tier.dienstaufsicht;

    const panel = el(`<div class="content-panel"><h2>📁 ${esc(akte.name)}</h2>${akte.dienstnummer ? `<div class="hint">Dienstnummer #${esc(akte.dienstnummer)}</div>` : ''}</div>`);

    if (kannHandeln) {
      panel.appendChild(renderPersonalakteAktionen(container, userId, akte));
    } else if (tier.officer) {
      panel.appendChild(el('<div class="hint" style="margin-top:14px;">Aktionen (Verwarnen/Suspendieren/Kündigen) sind für deine Rolle aktuell nicht freigeschaltet.</div>'));
    }

    if (akte.eintraege.length === 0) {
      panel.appendChild(el('<div class="hint" style="margin-top:14px;">Diese Personalakte ist leer.</div>'));
    }
    for (const e of akte.eintraege) {
      const zeit = new Date(e.zeitpunkt).toLocaleString('de-DE');
      const row = el(`
        <div class="field entry-row" data-typ="${esc(e.typ)}">
          <div style="display:flex; justify-content:space-between; gap:10px;">
            <div>
              <strong>${esc(e.label)}</strong>${e.kategorie ? ` · ${esc(e.kategorie)}` : ''}${e.widerrufen ? ' <span class="badge err" style="margin-left:6px;">zurückgenommen</span>' : ''}
              <div class="hint">${zeit} · ${esc(e.aktenzeichen || '')}</div>
              <div style="margin-top:4px;">${esc(e.grund)}</div>
            </div>
          </div>
          <div class="field-actions"></div>
        </div>
      `);
      const actions = row.querySelector('.field-actions');
      if (kannWiderrufen && !e.widerrufen && (e.typ === 'verwarnung' || e.typ === 'suspendierung')) {
        const btn = el('<button class="btn secondary small">Widerrufen</button>');
        const status = el('<span class="save-status"></span>');
        btn.onclick = async () => {
          setStatus(status, 'Speichere …');
          try {
            await api('personalakte_widerruf', { guild: state.currentGuild, target: userId, method: 'POST', body: { aktenzeichen: e.aktenzeichen } });
            renderPersonalakteDetail(container, userId);
          } catch (err) {
            setStatus(status, err.message, 'err');
          }
        };
        actions.appendChild(btn);
        actions.appendChild(status);
      }
      if (kannWiderrufen) {
        const delBtn = el('<button class="btn secondary small" style="border-color:var(--err); color:#ff97a4;">Löschen</button>');
        delBtn.onclick = async () => {
          if (!confirm('Diesen Eintrag endgültig löschen? Das kann nicht rückgängig gemacht werden.')) return;
          try {
            await api('personalakte_loeschen', { guild: state.currentGuild, target: userId, method: 'POST', body: { aktenzeichen: e.aktenzeichen } });
            renderPersonalakteDetail(container, userId);
          } catch (err) {
            alert(err.message);
          }
        };
        actions.appendChild(delBtn);
      }
      panel.appendChild(row);
    }
    container.appendChild(panel);
  } catch (e) {
    container.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
  }
}

async function renderBuergerakten(container) {
  container.innerHTML = '';
  const panel = el(`
    <div class="content-panel">
      <h2>🧑 Bürgerakten</h2>
      <div class="field">
        <input type="search" placeholder="Roblox-Name suchen …" id="ba-search" />
      </div>
      <div id="ba-liste"></div>
      <div class="field" style="margin-top:22px;">
        <label>Neue Bürgerakte / Eintrag hinzufügen</label>
        <div class="desc">Tippe den Roblox-Namen — passende Roblox-Konten werden live vorgeschlagen (inkl. Foto). Existiert noch keine Akte, wird automatisch eine neue angelegt.</div>
        <input type="text" placeholder="Roblox-Name" id="ba-name" style="margin-bottom:4px;" autocomplete="off" />
        <div class="rblx-suggest" id="ba-rblx-suggest" style="display:none;"></div>
        <textarea placeholder="Eintrag (z. B. Vorfall, Notiz) — optional" id="ba-text" style="min-height:80px; margin-top:8px;"></textarea>
        <div class="field-actions">
          <button class="btn small" id="ba-anlegen">Speichern</button>
          <span class="save-status" id="ba-status"></span>
        </div>
      </div>
    </div>
  `);
  container.appendChild(panel);

  const liste = panel.querySelector('#ba-liste');
  let selectedRoblox = null; // { id, name } — vom Live-Vorschlag übernommen

  async function suchen(query) {
    liste.innerHTML = '<div class="hint">Lade …</div>';
    try {
      const { buergerakten } = await api('buergerakten', { guild: state.currentGuild, search: query });
      // Roblox-Avatare für die Trefferliste nachladen (gebündelt, ein Aufruf für alle IDs).
      const idsMitFoto = buergerakten.filter((b) => b.roblox_user_id).map((b) => b.roblox_user_id);
      let avatarMap = {};
      if (idsMitFoto.length > 0) {
        try {
          const { avatars } = await robloxApi('avatar', { ids: idsMitFoto.join(',') });
          avatarMap = avatars || {};
        } catch { /* Avatare sind nice-to-have, Liste funktioniert auch ohne */ }
      }
      liste.innerHTML = '';
      if (buergerakten.length === 0) {
        liste.appendChild(el('<div class="hint">Keine Bürgerakten gefunden.</div>'));
      }
      for (const b of buergerakten) {
        const foto = b.roblox_user_id ? avatarMap[b.roblox_user_id] : null;
        const row = el(`
          <div class="buerger-row">
            ${foto ? `<img class="avatar-sm" src="${foto}" />` : '<div class="avatar-sm"></div>'}
            <div style="flex:1;">
              <div style="font-weight:600;">${esc(b.roblox_name)}</div>
            </div>
            <div class="hint">${b.eintraege_anzahl} Eintra${b.eintraege_anzahl === 1 ? 'g' : 'ege'} →</div>
          </div>
        `);
        row.onclick = () => {
          state.activeCategory = `buergerakte:${b.roblox_user_id}`;
          drawDashboard(document.querySelector('main'));
        };
        liste.appendChild(row);
      }
    } catch (e) {
      liste.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
    }
  }
  suchen('');
  let searchTimer = null;
  panel.querySelector('#ba-search').oninput = (ev) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => suchen(ev.target.value), 400);
  };

  // --- Live-Roblox-Vorschläge beim Anlegen einer neuen Akte ---
  // Robust gegen schnelles Tippen ("hundepfote"-Problem):
  //  - Debounce (350ms)
  //  - AbortController bricht die vorherige, noch laufende Anfrage ab
  //  - Server-seitiges Caching + Dedup übernimmt /api/roblox.js
  const nameInput = panel.querySelector('#ba-name');
  const suggestBox = panel.querySelector('#ba-rblx-suggest');
  let nameTimer = null;
  let nameAbort = null;

  nameInput.oninput = () => {
    selectedRoblox = null;
    clearTimeout(nameTimer);
    const q = nameInput.value.trim();
    if (q.length < 3) { suggestBox.style.display = 'none'; suggestBox.innerHTML = ''; return; }
    nameTimer = setTimeout(async () => {
      if (nameAbort) nameAbort.abort();
      nameAbort = new AbortController();
      try {
        const { users } = await robloxApi('search', { q }, nameAbort.signal);
        if (!users || users.length === 0) { suggestBox.style.display = 'none'; return; }
        const ids = users.map((u) => u.id).join(',');
        let avatarMap = {};
        try {
          const { avatars } = await robloxApi('avatar', { ids }, nameAbort.signal);
          avatarMap = avatars || {};
        } catch { /* Vorschau-Fotos sind optional */ }
        suggestBox.innerHTML = '';
        for (const u of users) {
          const foto = avatarMap[u.id];
          const item = el(`
            <div class="rblx-item">
              ${foto ? `<img class="avatar-sm" src="${foto}" style="width:28px;height:28px;" />` : '<div class="avatar-sm" style="width:28px;height:28px;"></div>'}
              <div><div class="name">${esc(u.name)}</div><div class="uname">${esc(u.displayName)}</div></div>
            </div>
          `);
          item.onclick = () => {
            nameInput.value = u.name;
            selectedRoblox = { id: u.id, name: u.name };
            suggestBox.style.display = 'none';
          };
          suggestBox.appendChild(item);
        }
        suggestBox.style.display = 'block';
      } catch (err) {
        if (err.name !== 'AbortError') suggestBox.style.display = 'none';
      }
    }, 350);
  };
  document.addEventListener('click', (ev) => {
    if (!panel.contains(ev.target)) return;
    if (ev.target !== nameInput && !suggestBox.contains(ev.target)) suggestBox.style.display = 'none';
  });

  const status = panel.querySelector('#ba-status');
  panel.querySelector('#ba-anlegen').onclick = async () => {
    const roblox_name = nameInput.value.trim();
    const text = panel.querySelector('#ba-text').value.trim();
    if (!roblox_name) { setStatus(status, 'Roblox-Name fehlt', 'err'); return; }
    setStatus(status, 'Speichere …');
    try {
      const body = { roblox_name, text };
      if (selectedRoblox && selectedRoblox.name.toLowerCase() === roblox_name.toLowerCase()) {
        body.roblox_user_id = selectedRoblox.id;
      }
      await api('buergerakten', { guild: state.currentGuild, method: 'POST', body });
      setStatus(status, 'Gespeichert ✓', 'ok');
      nameInput.value = '';
      panel.querySelector('#ba-text').value = '';
      selectedRoblox = null;
      suchen('');
    } catch (e) {
      setStatus(status, e.message, 'err');
    }
  };
}

async function renderBuergerakteDetail(container, robloxId) {
  try {
    const params = new URLSearchParams({ resource: 'buergerakte', guild: state.currentGuild, roblox_id: robloxId });
    const res = await fetch(`/api/bot?${params.toString()}`, { credentials: 'include' });
    const akte = await res.json();
    if (!res.ok) throw new Error(akte.error || 'Fehler');
    container.innerHTML = '';

    let fotoUrl = null;
    try {
      const { avatars } = await robloxApi('avatar', { id: robloxId });
      fotoUrl = avatars ? avatars[robloxId] : null;
    } catch { /* Foto ist optional */ }

    const panel = el(`
      <div class="content-panel" style="display:flex; gap:16px; align-items:flex-start;">
        ${fotoUrl ? `<img class="avatar-lg" src="${fotoUrl}" />` : '<div class="avatar-lg"></div>'}
        <div>
          <h2>🧑 ${esc(akte.roblox_name)}</h2>
          <div class="hint">Roblox-ID ${esc(akte.roblox_user_id)}</div>
        </div>
      </div>
    `);
    if (akte.eintraege.length === 0) {
      panel.appendChild(el('<div class="hint" style="margin-top:14px;">Noch keine Einträge.</div>'));
    }
    for (const e of akte.eintraege) {
      const zeit = new Date(e.zeitpunkt).toLocaleString('de-DE');
      panel.appendChild(el(`
        <div class="field">
          <div class="hint">${zeit}</div>
          <div style="margin-top:4px;">${esc(e.text)}</div>
        </div>

    container.appendChild(panel);
  } catch (e) {
    container.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;

}

function renderCategoryPanel(kategorie) {
  const panel = el(`
    <div class="content-panel">
      <h2>${esc(kategorie.label)}</h2>
      <div class="field-grid"></div>
    </div>
  `);
  const grid = panel.querySelector('.field-grid');

  for (const item of kategorie.items) {
    grid.appendChild(renderSelectField(item));
  }
  for (const item of kategorie.text_items) {
    grid.appendChild(renderTextField(item));
  }
  if (kategorie.items.length === 0 && kategorie.text_items.length === 0) {
    grid.appendChild(el('<div class="hint">Für diesen Bereich gibt es nichts einzustellen.</div>'));
  }
  return panel;
}

function statusEl() {
  return el('<span class="save-status"></span>');
}
function setStatus(node, text, kind) {
  node.textContent = text;
  node.className = 'save-status' + (kind ? ' ' + kind : '');
}

async function saveConfig(key, value, statusNode) {
  setStatus(statusNode, 'Speichere …');
  try {
    const res = await api('config', { guild: state.currentGuild, method: 'POST', body: { key, value } });
    state.config = res.config;
    setStatus(statusNode, 'Gespeichert ✓', 'ok');
    setTimeout(() => setStatus(statusNode, ''), 2000);
  } catch (e) {
    setStatus(statusNode, e.message, 'err');
  }
}

function renderSelectField(item) {
  const wide = item.kind === 'role_list';
  const wrap = el(`<div class="field-card${wide ? ' wide' : ''}"><label>${esc(item.label)}</label></div>`);

  if (item.kind === 'role_list') {
    const current = new Set((state.config[item.key] || []).map(String));
    const list = el('<div class="role-list"></div>');
    for (const r of state.roles) {
      const chip = el(`<div class="role-chip${current.has(r.id) ? ' active' : ''}">${esc(r.name)}</div>`);
      chip.onclick = () => {
        if (current.has(r.id)) current.delete(r.id); else current.add(r.id);
        chip.classList.toggle('active');
        saveConfig(item.key, Array.from(current), status);
      };
      list.appendChild(chip);
    }
    wrap.appendChild(list);
    const status = statusEl();
    wrap.appendChild(status);
    return wrap;
  }

  const select = el('<select></select>');
  select.appendChild(el(`<option value="">— nicht gesetzt —</option>`));
  const options = item.kind === 'role' ? state.roles : channelOptions(item.kind);
  const currentVal = state.config[item.key] ? String(state.config[item.key]) : '';
  for (const o of options) {
    const opt = el(`<option value="${esc(o.id)}">${esc(o.name)}</option>`);
    if (o.id === currentVal) opt.selected = true;
    select.appendChild(opt);
  }
  const status = statusEl();
  select.onchange = () => saveConfig(item.key, select.value || null, status);
  wrap.appendChild(select);
  wrap.appendChild(status);
  return wrap;
}

function renderTextField(item) {
  const wrap = el(`
    <div class="field-card${item.long_text ? ' wide' : ''}">
      <label>${esc(item.label)}</label>
      <div class="desc">${esc(item.beschreibung)}</div>
    </div>
  `);
  const currentVal = state.config[item.key] ?? '';
  const input = item.long_text ? el('<textarea></textarea>') : el('<input type="text" />');
  input.value = currentVal;
  const status = statusEl();
  let timer = null;
  input.oninput = () => {
    clearTimeout(timer);
    setStatus(status, 'Tippen …');
    timer = setTimeout(() => saveConfig(item.key, input.value, status), 700);
  };
  wrap.appendChild(input);
  wrap.appendChild(status);
  return wrap;
}

async function renderAdminSupport(container) {
  try {
    const { cases } = await api('support_cases');
    container.innerHTML = '';
    const panel = el('<div class="content-panel"><h2>📨 Support-Fälle</h2></div>');
    if (!cases || cases.length === 0) {
      panel.appendChild(el('<div class="hint">Aktuell keine offenen Support-Fälle.</div>'));
    }
    for (const c of (cases || [])) {
      const zeit = new Date(c.erstellt_am).toLocaleString('de-DE');
      const badgeKind = c.status === 'offen' ? 'warn' : c.status === 'geschlossen' ? 'ok' : 'purple';
      const row = el(`
        <div class="case-row" data-status="${esc(c.status)}">
          <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
            <div>
              <strong>${esc(c.titel || 'Ohne Titel')}</strong>
              <span class="badge ${badgeKind}" style="margin-left:8px;">${esc(c.status)}</span>
              ${c.vpn_verdacht ? '<span class="badge err" style="margin-left:6px;">⚠️ VPN-Verdacht</span>' : ''}
              <div class="hint">${zeit} · Server: ${esc(c.guild_name || c.guild_id || '—')} · von ${esc(c.ersteller_name || c.ersteller_id)}</div>
              <div style="margin-top:4px;">${esc(c.nachricht || '')}</div>
              ${c.letzte_ip ? `<div class="hint">Letzte bekannte IP: <code>${esc(c.letzte_ip)}</code></div>` : ''}
            </div>
          </div>
          <div class="field-actions">
            <select class="status-select">
              <option value="offen"${c.status === 'offen' ? ' selected' : ''}>Offen</option>
              <option value="in_bearbeitung"${c.status === 'in_bearbeitung' ? ' selected' : ''}>In Bearbeitung</option>
              <option value="geschlossen"${c.status === 'geschlossen' ? ' selected' : ''}>Geschlossen</option>
            </select>
            <input type="text" class="reply-input" placeholder="Antwort schreiben …" style="min-width:220px;" />
            <button class="btn small reply-btn">Antworten</button>
            <span class="save-status"></span>
          </div>
        </div>
      `);
      const status = row.querySelector('.save-status');
      row.querySelector('.status-select').onchange = async (ev) => {
        setStatus(status, 'Speichere …');
        try {
          await api('support_case_status', { target: c.id, method: 'POST', body: { status: ev.target.value } });
          setStatus(status, 'Gespeichert ✓', 'ok');
        } catch (err) {
          setStatus(status, err.message, 'err');
        }
      };
      row.querySelector('.reply-btn').onclick = async () => {
        const text = row.querySelector('.reply-input').value.trim();
        if (!text) return;
        setStatus(status, 'Sende …');
        try {
          await api('support_case_reply', { target: c.id, method: 'POST', body: { text } });
          row.querySelector('.reply-input').value = '';
          setStatus(status, 'Gesendet ✓', 'ok');
        } catch (err) {
          setStatus(status, err.message, 'err');
        }
      };
      panel.appendChild(row);
    }
    container.appendChild(panel);
  } catch (e) {
    container.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
  }
}

async function renderAdminGuildLocks(container) {
  try {
    const { guilds } = await api('admin_guilds');
    container.innerHTML = '';
    const panel = el('<div class="content-panel"><h2>🔒 Server sperren</h2><div class="hint" style="margin-bottom:8px;">Ein gesperrter Server kann vom Bot nicht mehr über das Dashboard verwaltet werden.</div></div>');
    for (const g of (guilds || [])) {
      const row = el(`
        <div class="lock-row">
          <div>
            <strong>${esc(g.name)}</strong>
            ${g.locked ? '<span class="badge err" style="margin-left:8px;">gesperrt</span>' : '<span class="badge ok" style="margin-left:8px;">aktiv</span>'}
            ${g.locked && g.lock_grund ? `<div class="hint">Grund: ${esc(g.lock_grund)}</div>` : ''}
          </div>
          <div class="field-actions">
            ${g.locked
              ? '<button class="btn secondary small unlock-btn">Entsperren</button>'
              : '<input type="text" class="lock-reason" placeholder="Grund" style="min-width:160px;" /><button class="btn danger small lock-btn">Sperren</button>'}
            <span class="save-status"></span>
          </div>
        </div>
      `);
      const status = row.querySelector('.save-status');
      const lockBtn = row.querySelector('.lock-btn');
      if (lockBtn) {
        lockBtn.onclick = async () => {
          const grund = row.querySelector('.lock-reason').value.trim();
          setStatus(status, 'Sperre …');
          try {
            await api('admin_lock', { target: g.id, method: 'POST', body: { grund } });
            renderAdminGuildLocks(container);
          } catch (err) {
            setStatus(status, err.message, 'err');
          }
        };
      }
      const unlockBtn = row.querySelector('.unlock-btn');
      if (unlockBtn) {
        unlockBtn.onclick = async () => {
          setStatus(status, 'Entsperre …');
          try {
            await api('admin_unlock', { target: g.id, method: 'POST', body: {} });
            renderAdminGuildLocks(container);
          } catch (err) {
            setStatus(status, err.message, 'err');
          }
        };
      }
      panel.appendChild(row);
    }
    container.appendChild(panel);
  } catch (e) {
    container.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
  }
}

async function renderAdminUserLocks(container) {
  container.innerHTML = '';
  const panel = el(`
    <div class="content-panel">
      <h2>🚫 User- / IP-Sperren</h2>
      <div class="hint" style="margin-bottom:10px;">
        Eine User-Sperre wirkt sofort beim nächsten Discord-Login (fälschungssicher, da Discord-Login nicht spoofbar ist).
        Beim Sperren wird automatisch auch die zuletzt bekannte IP mitgesperrt — das deckt i.d.R. auch andere Geräte im
        selben Netzwerk/WLAN ab, da diese dieselbe öffentliche IP teilen. Eine 100%ige VPN-Umgehungssicherheit gibt es
        technisch nicht — VPN/Proxy-Verdacht wird nur als Warnhinweis angezeigt.
      </div>
      <div class="field-grid" style="margin-bottom:20px;">
        <div class="field-card">
          <label>Discord-User-ID sperren</label>
          <input type="text" id="lock-user-id" placeholder="z. B. 123456789012345678" />
          <input type="text" id="lock-user-reason" placeholder="Grund" />
          <button class="btn danger small" id="lock-user-btn">Sperren (+ letzte IP)</button>
          <span class="save-status" id="lock-user-status"></span>
        </div>
        <div class="field-card">
          <label>IP direkt sperren</label>
          <input type="text" id="lock-ip" placeholder="z. B. 203.0.113.42" />
          <input type="text" id="lock-ip-reason" placeholder="Grund" />
          <button class="btn danger small" id="lock-ip-btn">IP sperren</button>
          <span class="save-status" id="lock-ip-status"></span>
        </div>
      </div>
      <div id="locks-liste"><div class="hint">Lade aktuelle Sperren …</div></div>
    </div>
  `);
  container.appendChild(panel);

  panel.querySelector('#lock-user-btn').onclick = async () => {
    const id = panel.querySelector('#lock-user-id').value.trim();
    const grund = panel.querySelector('#lock-user-reason').value.trim();
    const status = panel.querySelector('#lock-user-status');
    if (!id) { setStatus(status, 'User-ID fehlt', 'err'); return; }
    setStatus(status, 'Sperre …');
    try {
      await api('security_lock_user', { target: id, method: 'POST', body: { grund, auch_ip: true } });
      setStatus(status, 'Gesperrt ✓', 'ok');
      ladeSperrliste();
    } catch (err) {
      setStatus(status, err.message, 'err');
    }
  };
  panel.querySelector('#lock-ip-btn').onclick = async () => {
    const ip = panel.querySelector('#lock-ip').value.trim();
    const grund = panel.querySelector('#lock-ip-reason').value.trim();
    const status = panel.querySelector('#lock-ip-status');
    if (!ip) { setStatus(status, 'IP fehlt', 'err'); return; }
    setStatus(status, 'Sperre …');
    try {
      await api('security_lock_ip', { method: 'POST', body: { ip, grund } });
      setStatus(status, 'Gesperrt ✓', 'ok');
      ladeSperrliste();
    } catch (err) {
      setStatus(status, err.message, 'err');
    }
  };

  const liste = panel.querySelector('#locks-liste');
  async function ladeSperrliste() {
    liste.innerHTML = '<div class="hint">Lade …</div>';
    try {
      const { users, ips } = await api('security_locks');
      liste.innerHTML = '';
      if ((!users || users.length === 0) && (!ips || ips.length === 0)) {
        liste.appendChild(el('<div class="hint">Keine aktiven Sperren.</div>'));
        return;
      }
      for (const u of (users || [])) {
        const row = el(`
          <div class="lock-row">
            <div><strong>${esc(u.name || u.user_id)}</strong> <span class="hint">(${esc(u.user_id)})</span>${u.grund ? `<div class="hint">Grund: ${esc(u.grund)}</div>` : ''}</div>
            <div class="field-actions"><button class="btn secondary small">Entsperren</button><span class="save-status"></span></div>
          </div>
        `);
        const status = row.querySelector('.save-status');
        row.querySelector('button').onclick = async () => {
          setStatus(status, 'Entsperre …');
          try { await api('security_unlock_user', { target: u.user_id, method: 'POST', body: {} }); ladeSperrliste(); }
          catch (err) { setStatus(status, err.message, 'err'); }
        };
        liste.appendChild(row);
      }
      for (const ip of (ips || [])) {
        const row = el(`
          <div class="lock-row">
            <div><strong><code>${esc(ip.ip)}</code></strong>${ip.grund ? `<div class="hint">Grund: ${esc(ip.grund)}</div>` : ''}</div>
            <div class="field-actions"><button class="btn secondary small">Entsperren</button><span class="save-status"></span></div>
          </div>
        `);
        const status = row.querySelector('.save-status');
        row.querySelector('button').onclick = async () => {
          setStatus(status, 'Entsperre …');
          try { await api('security_unlock_ip', { target: ip.ip, method: 'POST', body: {} }); ladeSperrliste(); }
          catch (err) { setStatus(status, err.message, 'err'); }
        };
        liste.appendChild(row);
      }
    } catch (e) {
      liste.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
    }
  }
  ladeSperrliste();
}
