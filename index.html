<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polizei System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ------------------------------------------------------------------
     Designsystem: neutrale Verwaltungssoftware-Optik (wie ein echtes
     Polizei-CAD/RMS-System), bewusst zurückhaltend statt "Marketing-SaaS":
     ein Akzentton, flache Flächen, feine Linien statt Schlagschatten,
     Statusfarben nur dort, wo sie tatsächlich einen Status bedeuten.
     ------------------------------------------------------------------ */
  :root {
    /* Himmelblau-Theme: kräftiger, gesättigter Himmelblau-Ton als Seiten-
       hintergrund (nicht blass/weißlich), weiße Panels heben sich davon ab.
       Akzentfarbe ist ein deutlich dunkleres Blau, damit Buttons/aktive
       Zustände auf dem hellen Himmelblau noch klar erkennbar bleiben. */
    --bg: #4fa3e3;
    --surface: #ffffff;
    --surface-2: #f2f8fd;
    --surface-3: #e1eefb;
    --border: #cfe0f5;
    --border-soft: #dce9f8;

    --accent: #175fb0;
    --accent-dim: rgba(23,95,176,0.14);
    --accent-text: #0f3f78;

    --text: #0f2038;
    --text-dim: #2c4d78;
    --text-faint: #4c6c94;

    --ok: #157a56;
    --ok-soft: rgba(21,122,86,0.14);
    --warn: #93650c;
    --warn-soft: rgba(147,101,12,0.16);
    --err: #b23a4c;
    --err-soft: rgba(178,58,76,0.14);
    /* "gold" markiert Admin-/Aufsichts-Funktionen — bewusst gedeckt statt bunt */
    --gold: #8a6524;
    --gold-soft: rgba(138,101,36,0.16);

    --radius: 8px;
    --radius-sm: 6px;
    font-family: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
  }
  a { color: var(--accent-text); }
  ::selection { background: var(--accent-dim); color: var(--accent-text); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  code { font-family: 'JetBrains Mono', monospace; font-size: 0.92em; }

  /* ---------------------------- Login ---------------------------- */
  .center-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    padding: 20px;
    text-align: center;
  }
  .badge-mark {
    width: 48px; height: 48px;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 16px;
    color: var(--accent-text);
  }
  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-faint);
  }
  h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .lede { color: var(--text-dim); max-width: 380px; font-size: 13.5px; line-height: 1.6; margin: 0; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--accent);
    color: #ffffff;
    border: 1px solid var(--accent);
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    text-decoration: none;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: #5f8ad2; border-color: #5f8ad2; }
  .btn:active { transform: translateY(1px); }
  .btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn.secondary:hover { background: var(--surface-3); }
  .btn.danger { background: var(--err); border-color: var(--err); color: #ffffff; }
  .btn.danger:hover { background: #d05a6b; }
  .btn.purple { background: var(--gold); border-color: var(--gold); color: #ffffff; }
  .btn.purple:hover { background: #c7a666; }
  .btn.small { padding: 6px 12px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .error-box {
    border: 1px solid rgba(207,74,92,0.35);
    background: var(--err-soft);
    color: #9c2f42;
    padding: 10px 13px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    max-width: 420px;
  }

  /* --------------------------- Topbar ----------------------------- */
  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 22px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 5;
    flex-wrap: wrap;
  }
  header.topbar .brand {
    display: flex; align-items: center; gap: 9px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 1px;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  header.topbar .brand .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .user-chip { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-dim); }
  .user-chip img { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 18px 90px; }

  /* ------------------------- Guild picker -------------------------- */
  .page-heading { display: flex; flex-direction: column; gap: 3px; margin-bottom: 20px; }
  .page-heading h1 { font-size: 19px; }
  .page-heading p { color: var(--text-dim); font-size: 13px; margin: 0; }

  .guild-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1px; background: var(--border-soft); border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; }
  .guild-card {
    background: var(--surface);
    padding: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: background .1s;
  }
  .guild-card:hover { background: var(--surface-2); }
  .guild-card img, .guild-card .fallback-icon {
    width: 36px; height: 36px; border-radius: var(--radius-sm); flex-shrink: 0;
    background: var(--surface-3);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--accent-text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  .guild-card .meta { min-width: 0; }
  .guild-card .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .guild-card .sub { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-faint); margin: 30px 0 10px; font-weight: 600; }
  .invite-card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: space-between;
  }
  .invite-card .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .invite-card .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .invite-card + .invite-card { margin-top: 6px; }

  /* ---------------------------- Stats ------------------------------ */
  .stats-panel {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .stats-panel h2 { margin: 0 0 12px; font-size: 14.5px; display: flex; align-items: center; gap: 9px; font-weight: 700; }
  .stats-panel h2 img { width: 26px; height: 26px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .stat-row { display: flex; flex-wrap: wrap; gap: 28px; }
  .stat { min-width: 80px; }
  .stat .n { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: var(--text); font-weight: 600; }
  .stat .l { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
  .progress-bar { height: 4px; background: var(--surface-3); border-radius: 2px; overflow: hidden; margin-top: 12px; }
  .progress-bar .fill { height: 100%; background: var(--accent); }

  /* ------------------------ Kategorie-Leiste ------------------------ */
  nav.categories { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--border-soft); padding-bottom: 14px; }
  nav.categories button {
    background: transparent;
    border: 1px solid var(--border-soft);
    color: var(--text-dim);
    padding: 7px 13px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: border-color .1s, color .1s, background .1s;
  }
  nav.categories button:hover { border-color: var(--border); color: var(--text); background: var(--surface); }
  nav.categories button.active { background: var(--accent); border-color: var(--accent); color: #ffffff; }
  nav.categories button.admin-tab.active { background: var(--gold); border-color: var(--gold); color: #ffffff; }

  .content-panel {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 20px;
  }
  .content-panel h2 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
  .content-panel + .content-panel { margin-top: 14px; }

  .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-top: 14px; }
  .field-card {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 13px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .field-card.wide { grid-column: 1 / -1; }
  .field-card label { display: block; font-size: 12.5px; font-weight: 600; }
  .field-card .desc { font-size: 11.5px; color: var(--text-dim); margin: -3px 0 1px; line-height: 1.5; }

  .field { margin-top: 14px; }
  .field:first-of-type { margin-top: 0; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  .field .desc { font-size: 11.5px; color: var(--text-dim); margin-bottom: 7px; line-height: 1.5; }

  select, input[type=text], input[type=search], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
  }
  textarea { min-height: 100px; resize: vertical; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
  .role-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .role-chip {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    font-size: 11.5px;
    cursor: pointer;
    user-select: none;
    color: var(--text-dim);
    transition: border-color .1s, color .1s, background .1s;
  }
  .role-chip.active { border-color: var(--accent); color: var(--accent-text); background: var(--accent-dim); }
  .field-actions { display: flex; align-items: center; gap: 9px; margin-top: 9px; flex-wrap: wrap; }
  .save-status { font-size: 11.5px; color: var(--text-dim); }
  .save-status.ok { color: var(--ok); }
  .save-status.err { color: var(--err); }
  .loading { color: var(--text-dim); padding: 36px; text-align: center; font-size: 13px; }
  .hint { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; line-height: 1.5; }

  /* ----------------------- Badges / status ------------------------- */
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-sm); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.err { background: var(--err-soft); color: #9c2f42; }
  .badge.purple { background: var(--gold-soft); color: var(--gold); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .status-dot.ok { background: var(--ok); }
  .status-dot.err { background: var(--err); }
  .status-dot.warn { background: var(--warn); }

  .entry-row { border-left: 2px solid var(--border); padding-left: 13px !important; margin-left: -2px; }
  .entry-row[data-typ="kuendigung"] { border-left-color: var(--err); }
  .entry-row[data-typ="verwarnung"] { border-left-color: var(--warn); }
  .entry-row[data-typ="suspendierung"] { border-left-color: #b9773a; }
  .entry-row[data-typ="sonstiges"] { border-left-color: var(--text-faint); }

  /* --------------------------- Bürgerakten -------------------------- */
  .buerger-row { display: flex; align-items: center; gap: 11px; padding: 9px 4px; cursor: pointer; border-radius: var(--radius-sm); }
  .buerger-row:hover { background: var(--surface-2); }
  .avatar-sm { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--surface-3); border: 1px solid var(--border); object-fit: cover; flex-shrink: 0; }
  .avatar-lg { width: 88px; height: 88px; border-radius: var(--radius); background: var(--surface-3); border: 1px solid var(--border); object-fit: cover; }
  .rblx-suggest { border: 1px solid var(--border-soft); border-radius: var(--radius-sm); margin-top: 5px; overflow: hidden; background: var(--bg); }
  .rblx-suggest .rblx-item { display: flex; align-items: center; gap: 9px; padding: 7px 9px; cursor: pointer; font-size: 12.5px; }
  .rblx-suggest .rblx-item:hover { background: var(--surface-2); }
  .rblx-suggest .rblx-item .name { font-weight: 600; }
  .rblx-suggest .rblx-item .uname { color: var(--text-faint); font-size: 11px; }

  /* ----------------------------- Admin ------------------------------ */
  .admin-hero {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-left: 3px solid var(--gold);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .admin-hero h2 { margin: 0; font-size: 14.5px; color: var(--gold); }
  .admin-hero p { margin: 2px 0 0; font-size: 12px; color: var(--text-dim); }
  .case-row { border-left: 2px solid var(--border); padding: 9px 0 9px 13px; margin-bottom: 7px; }
  .case-row[data-status="offen"] { border-left-color: var(--warn); }
  .case-row[data-status="in_bearbeitung"] { border-left-color: var(--accent); }
  .case-row[data-status="geschlossen"] { border-left-color: var(--ok); }
  .lock-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--border-soft); }
  .lock-row:first-child { border-top: none; }

  /* -------------------------- Toggle-Switch -------------------------- */
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; cursor: pointer; inset: 0; background: var(--surface-3); border: 1px solid var(--border); border-radius: 999px; transition: background .12s; }
  .switch .slider::before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; top: 3px; background: var(--text-dim); border-radius: 50%; transition: transform .12s, background .12s; }
  .switch input:checked + .slider { background: var(--accent-dim); border-color: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(18px); background: var(--accent); }

  /* ---------------------------------------------------------------------
     Startseite / Landing (nicht eingeloggt): eigenständiges, dunkles
     "Produkt-Launch"-Design, bewusst getrennt von den Design-Tokens des
     eingeloggten Dashboards (dort weiterhin die helle CAD-Optik) — Marken-
     auftritt und Arbeitswerkzeug dürfen unterschiedlich aussehen. Eigene
     Variablen, damit nichts mit :root kollidiert.
     --------------------------------------------------------------------- */
  .landing {
    --l-bg: #090c12;
    --l-bg-2: #0c1019;
    --l-surface: rgba(255,255,255,0.03);
    --l-surface-hover: rgba(255,255,255,0.05);
    --l-border: rgba(255,255,255,0.08);
    --l-border-strong: rgba(255,255,255,0.14);
    --l-text: #eef1f7;
    --l-text-dim: #98a2b8;
    --l-text-faint: #616c82;
    --l-cyan: #22d3ee;
    --l-indigo: #6d6bf7;
    --l-violet: #9b7cf5;
    --l-accent-grad: linear-gradient(90deg, #6d6bf7, #4f8bf0);

    position: relative;
    min-height: 100vh;
    display: flex; flex-direction: column;
    background: var(--l-bg);
    color: var(--l-text);
    overflow: hidden;
    isolation: isolate;
  }
  .landing * { box-sizing: border-box; }
  .landing canvas.landing-net { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .55; pointer-events: none; }
  .landing .landing-glow {
    position: absolute; z-index: 0; pointer-events: none; filter: blur(70px);
  }
  .landing .landing-glow.g1 { top: -160px; left: -120px; width: 620px; height: 620px; background: radial-gradient(circle, rgba(34,211,238,0.20), transparent 70%); }
  .landing .landing-glow.g2 { bottom: -220px; right: -160px; width: 720px; height: 720px; background: radial-gradient(circle, rgba(109,107,247,0.22), transparent 70%); }

  .landing-header {
    position: relative; z-index: 3;
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; padding: 16px 32px;
    border-bottom: 1px solid var(--l-border);
    background: rgba(9,12,18,0.72);
    backdrop-filter: blur(10px);
    position: sticky; top: 0;
  }
  .landing-header .brand-mark { display: flex; align-items: center; gap: 10px; }
  .landing-header .brand-mark .badge-mark {
    width: 32px; height: 32px; font-size: 13px; border-radius: 9px;
    background: linear-gradient(135deg, rgba(34,211,238,0.18), rgba(109,107,247,0.18));
    border: 1px solid var(--l-border-strong); color: var(--l-cyan);
  }
  .landing-header .brand-text .name { font-weight: 700; font-size: 15px; color: var(--l-text); letter-spacing: -0.01em; }
  .landing-nav-links { display: flex; align-items: center; gap: 28px; }
  .landing-nav-links a {
    color: var(--l-text-dim); text-decoration: none; font-size: 13px; font-weight: 500;
    transition: color .15s;
  }
  .landing-nav-links a:hover { color: var(--l-text); }
  .landing-header-actions { display: flex; align-items: center; gap: 10px; }
  .l-btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 600; text-decoration: none;
    padding: 9px 18px; border-radius: 8px; cursor: pointer;
    transition: transform .12s, background .15s, border-color .15s, box-shadow .15s;
    border: 1px solid transparent; white-space: nowrap;
  }
  .l-btn:active { transform: translateY(1px); }
  .l-btn.primary {
    background: var(--l-accent-grad); color: #fff;
    box-shadow: 0 8px 24px -8px rgba(79,139,240,0.55);
  }
  .l-btn.primary:hover { box-shadow: 0 10px 28px -6px rgba(79,139,240,0.7); }
  .l-btn.ghost { background: rgba(255,255,255,0.04); color: var(--l-text); border-color: var(--l-border-strong); }
  .l-btn.ghost:hover { background: rgba(255,255,255,0.08); }
  .l-btn.large { padding: 13px 24px; font-size: 14.5px; }

  /* --------------------------- Hero --------------------------- */
  .landing-hero {
    position: relative; z-index: 2;
    max-width: 880px; margin: 0 auto; width: 100%;
    padding: 96px 28px 70px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
  }
  .l-pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--l-cyan); background: rgba(34,211,238,0.08);
    border: 1px solid rgba(34,211,238,0.28);
    padding: 6px 14px; border-radius: 999px; margin-bottom: 24px;
  }
  .l-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--l-cyan); box-shadow: 0 0 8px var(--l-cyan); }
  .landing-hero h1 {
    font-size: 52px; line-height: 1.12; letter-spacing: -0.02em; font-weight: 800;
    margin: 0 0 22px; color: var(--l-text);
  }
  .landing-hero h1 .grad {
    background: linear-gradient(90deg, var(--l-cyan), var(--l-indigo) 65%, var(--l-violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .landing-hero .lede {
    max-width: 58ch; color: var(--l-text-dim); font-size: 15.5px; line-height: 1.7;
    margin: 0 0 34px;
  }
  .landing-hero .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .landing-hero-stats {
    position: relative; z-index: 2;
    max-width: 880px; margin: 0 auto 90px; width: 100%; padding: 0 28px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px;
    background: var(--l-border); border: 1px solid var(--l-border); border-radius: 12px; overflow: hidden;
  }
  .landing-hero-stats .stat { background: var(--l-bg-2); padding: 18px 20px; text-align: center; }

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function hexToRgba(hex, alpha) {
  const n = parseInt(hex.replace('#', ''), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function redirectUri() {
  return `${location.origin}/api/callback`;
}

function loginUrl() {
  const params = new URLSearchParams({
    client_id: DISCORD_CLIENT_ID,
    redirect_uri: redirectUri(),
    response_type: 'code',
    scope: 'identify guilds',
  });
  return `https://discord.com/oauth2/authorize?${params.toString()}`;
}

function inviteUrl(guildId) {
  const params = new URLSearchParams({
    client_id: DISCORD_CLIENT_ID,
    scope: 'bot applications.commands',
    permissions: '8',
    guild_id: guildId,
    disable_guild_select: 'true',
  });
  return `https://discord.com/oauth2/authorize?${params.toString()}`;
}

async function api(resource, { guild, target, search, method = 'GET', body, extraParams } = {}) {
  const params = new URLSearchParams({ resource });
  if (guild) params.set('guild', guild);
  if (target) params.set('target', target);
  if (search) params.set('search', search);
  if (extraParams) for (const [k, v] of Object.entries(extraParams)) params.set(k, v);
  const res = await fetch(`/api/bot?${params.toString()}`, {
    method,
    credentials: 'include',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Fehler (${res.status})`);
  return data;
}

// Direkter (kein Login/Cookie nötig) Zugriff auf den Roblox-Proxy.
async function robloxApi(action, params, signal) {
  const p = new URLSearchParams({ action, ...params });
  const res = await fetch(`/api/roblox?${p.toString()}`, { signal });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Roblox-API-Fehler');
  return data;
}

function guildIconUrl(g) {
  if (!g.icon) return null;
  if (g.icon.startsWith('http')) return g.icon;
  return `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=64`;
}

// Dezentes animiertes Punkte-/Linien-Netz im Hero-Hintergrund der Startseite
// (reines Canvas, keine Library) — läuft nur, solange die Landingpage
// sichtbar ist, und wird beim Verlassen sauber gestoppt.
let _landingNetHandle = null;
function startLandingNet(canvas) {
  const ctx = canvas.getContext('2d');
  let width, height, points;
  const DENSITY = 14000; // größerer Wert = weniger Punkte
  const LINK_DIST = 130;

  function resize() {
    width = canvas.width = canvas.offsetWidth * devicePixelRatio;
    height = canvas.height = canvas.offsetHeight * devicePixelRatio;
    const count = Math.max(28, Math.min(70, Math.floor((width * height) / (DENSITY * devicePixelRatio * devicePixelRatio))));
    points = Array.from({ length: count }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.18 * devicePixelRatio,
      vy: (Math.random() - 0.5) * 0.18 * devicePixelRatio,
    }));
  }
  resize();
  window.addEventListener('resize', resize);

  function tick() {
    ctx.clearRect(0, 0, width, height);
    for (const p of points) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;
    }
    for (let i = 0; i < points.length; i++) {
      for (let j = i + 1; j < points.length; j++) {
        const dx = points[i].x - points[j].x, dy = points[i].y - points[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINK_DIST * devicePixelRatio) {
          ctx.strokeStyle = `rgba(109,140,247,${0.16 * (1 - dist / (LINK_DIST * devicePixelRatio))})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(points[i].x, points[i].y);
          ctx.lineTo(points[j].x, points[j].y);
          ctx.stroke();
        }
      }
    }
    for (const p of points) {
      ctx.fillStyle = 'rgba(148,197,255,0.55)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.4 * devicePixelRatio, 0, Math.PI * 2);
      ctx.fill();
    }
    _landingNetHandle = requestAnimationFrame(tick);
  }
  tick();
  return () => { cancelAnimationFrame(_landingNetHandle); window.removeEventListener('resize', resize); };
}

// Kleines Overlay-Formular, mit dem JEDER eingeloggte Nutzer (nicht nur Admin)
// einen Support-Fall eröffnen kann. Landet im Admin-Bereich unter "Support-Fälle".
function openSupportModal() {
  const overlay = el(`
    <div style="position:fixed; inset:0; background:rgba(4,6,10,0.65); backdrop-filter:blur(3px); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px;">
      <div class="content-panel" style="max-width:420px; width:100%;">
        <h2>🆘 Support kontaktieren</h2>
        <div class="hint" style="margin-bottom:10px;">Deine Anfrage geht direkt an den Bot-Entwickler.</div>
        <div class="field">
          <label>Titel</label>
          <input type="text" id="support-titel" placeholder="Kurze Zusammenfassung" />
        </div>
        <div class="field">
          <label>Nachricht</label>
          <textarea id="support-nachricht" placeholder="Was ist das Problem?" style="min-height:100px;"></textarea>
        </div>
        <div class="field-actions">
          <button class="btn small" id="support-send">Absenden</button>
          <button class="btn secondary small" id="support-cancel">Abbrechen</button>
          <span class="save-status" id="support-status"></span>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (ev) => { if (ev.target === overlay) overlay.remove(); });
  overlay.querySelector('#support-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#support-send').onclick = async () => {
    const titel = overlay.querySelector('#support-titel').value.trim();
    const nachricht = overlay.querySelector('#support-nachricht').value.trim();
    const status = overlay.querySelector('#support-status');
    if (!nachricht) { setStatus(status, 'Nachricht fehlt', 'err'); return; }
    setStatus(status, 'Sende …');
    try {
      await api('support_case_create', {
        method: 'POST',
        body: { titel, nachricht, guild_id: state.currentGuild, ersteller_name: state.user.name },
      });
      setStatus(status, 'Gesendet ✓', 'ok');
      setTimeout(() => overlay.remove(), 900);
    } catch (e) {
      setStatus(status, e.message, 'err');
    }
  };
}

async function renderGuildPicker() {
  app.innerHTML = '';

  const main = el('<main></main>');

  const inviteSection = el('<div></div>');
  main.appendChild(inviteSection);
  app.appendChild(main);

  grid.innerHTML = '<div class="loading">Lade Server …</div>';
  try {
    const { managed, unmanaged } = await api('guilds');
    state.guilds = managed;
    grid.innerHTML = '';
    if (managed.length === 0) {

    for (const g of managed) {
      const icon = guildIconUrl(g);

    if (unmanaged.length > 0) {

        const icon = guildIconUrl(g);
        const card = el(`

        inviteSection.appendChild(card);

    }
  } catch (e) {
    grid.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
  }
}

async function openGuild(guildId) {

async function renderGuildDashboard() {
  app.innerHTML = '';
  renderTopbar(app);
  const main = el('<main></main>');
  main.appendChild(el('<div class="loading">Lade Server-Daten …</div>'));
  app.appendChild(main);

  const tier = state.tier || {};
  try {
    const calls = [
      // Module werden für JEDES Zugriffslevel geladen, damit z. B. auch
      // normale Polizisten die Bürgerakten-Kachel nicht sehen, wenn ein
      // Admin dieses Modul für den Server deaktiviert hat.
      api('modules', { guild: state.currentGuild })
        .then((r) => (state.modules = r.module))
        .catch(() => (state.modules = { buergerakten: true, bewerbungsfragen: true })),
    ];
    if (tier.admin) {
      calls.push(
        api('schema', { guild: state.currentGuild }).then((r) => (state.schema = r.categories)),
        api('config', { guild: state.currentGuild }).then((r) => (state.config = r.config)),
        api('channels', { guild: state.currentGuild }).then((r) => (state.channels = r.channels)),
        api('roles', { guild: state.currentGuild }).then((r) => (state.roles = r.roles)),
        api('stats', { guild: state.currentGuild }).then((r) => (state.stats = r))
      );
    }
    await Promise.all(calls);
    state.activeCategory = tier.admin ? (state.schema[0]?.id ?? null) : 'personalakte_eigene';
    if (!tier.admin && (tier.staff || tier.dienstaufsicht)) state.activeCategory = 'personalakten';
    else if (!tier.admin && tier.officer) state.activeCategory = 'personalakte_eigene';
    drawDashboard(main);
  } catch (e) {
    main.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
  }
}

function drawDashboard(main) {
  main.innerHTML = '';
  const tier = state.tier || {};
  const s = state.stats;
  const modules = state.modules || { buergerakten: true, bewerbungsfragen: true };

  if (tier.admin && s) {
    const pct = s.config_gesamt ? Math.round((s.config_gesetzt / s.config_gesamt) * 100) : 0;
    main.appendChild(el(`
      <div class="stats-panel">
        <h2>${s.icon ? `<img src="${s.icon}" />` : ''} ${esc(s.name)}</h2>
        <div class="stat-row">
          <div class="stat"><div class="n">${s.member_count}</div><div class="l">Mitglieder</div></div>
          <div class="stat"><div class="n">${s.channel_count}</div><div class="l">Channels</div></div>
          <div class="stat"><div class="n">${s.role_count}</div><div class="l">Rollen</div></div>
          <div class="stat"><div class="n">${s.dienstnummern_vergeben}</div><div class="l">Dienstnummern</div></div>
          <div class="stat"><div class="n">${s.config_gesetzt}/${s.config_gesamt}</div><div class="l">Konfiguriert</div></div>
        </div>
        <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
      </div>
    `));
  } else {
    main.appendChild(el(`<div class="stats-panel"><h2>${esc(state.tier?.name ?? 'Server')}</h2></div>`));
  }

  // Kategorie-Leiste: horizontale, umbrechende Chips statt Sidebar -> kein Scrollen mehr nötig.
  const nav = el('<nav class="categories"></nav>');
  const navButton = (label, id) => {
    const btn = el(`<button>${label}</button>`);
    if (state.activeCategory === id) btn.classList.add('active');
    btn.onclick = () => { state.activeCategory = id; drawDashboard(main); };
    nav.appendChild(btn);
  };

  if (tier.admin) {
    for (const kat of state.schema) navButton(kat.label, kat.id);
    if (modules.bewerbungsfragen) navButton('📋 Bewerbungsfragen', '_bewerbungsfragen');
    navButton('🔐 Zugriffsrechte', '_zugriffsrechte');
    navButton('🧩 Module', '_module');
  }
  if (tier.admin || tier.staff || tier.dienstaufsicht) {
    navButton('👮 Personalakten', 'personalakten');
  } else if (tier.officer) {
    navButton('📁 Meine Akte', 'personalakte_eigene');
  }
  if (modules.buergerakten) navButton('🧑 Bürgerakten', 'buergerakten');
  main.appendChild(nav);

  const contentWrap = el('<div></div>');
  main.appendChild(contentWrap);

  if (state.activeCategory === '_bewerbungsfragen') {
    contentWrap.innerHTML = '<div class="loading">Lade Fragen …</div>';
    renderBewerbungsfragenPanel(contentWrap);
  } else if (state.activeCategory === '_zugriffsrechte') {
    contentWrap.innerHTML = '<div class="loading">Lade Einstellung …</div>';
    renderZugriffsrechtePanel(contentWrap);
  } else if (state.activeCategory === '_module') {
    contentWrap.innerHTML = '<div class="loading">Lade Module …</div>';
    renderModulePanel(contentWrap);
  } else if (state.activeCategory === 'personalakten') {
    contentWrap.innerHTML = '<div class="loading">Lade Personalakten …</div>';
    renderPersonalaktenListe(contentWrap);
  } else if (state.activeCategory === 'personalakte_eigene') {
    contentWrap.innerHTML = '<div class="loading">Lade deine Akte …</div>';
    renderPersonalakteDetail(contentWrap, state.user.id);
  } else if (state.activeCategory && state.activeCategory.startsWith('personalakte:')) {
    contentWrap.innerHTML = '<div class="loading">Lade Akte …</div>';
    renderPersonalakteDetail(contentWrap, state.activeCategory.split(':')[1]);
  } else if (state.activeCategory === 'buergerakten') {
    contentWrap.innerHTML = '<div class="loading">Lade Bürgerakten …</div>';
    renderBuergerakten(contentWrap);
  } else if (state.activeCategory && state.activeCategory.startsWith('buergerakte:')) {
    contentWrap.innerHTML = '<div class="loading">Lade Bürgerakte …</div>';
    renderBuergerakteDetail(contentWrap, state.activeCategory.split(':')[1]);
  } else {
    const kategorie = state.schema?.find((k) => k.id === state.activeCategory);
    if (kategorie) contentWrap.appendChild(renderCategoryPanel(kategorie));
  }
}

async function renderBewerbungsfragenPanel(container) {
  try {
    const { arten } = await api('bewerbungsfragen', { guild: state.currentGuild });
    container.innerHTML = '';
    for (const art of arten) {
      const panel = el(`
        <div class="content-panel">
          <h2>${esc(art.label)}</h2>
          <div class="hint" style="margin-bottom:10px;">${esc(art.beschreibung)} — eine Frage pro Zeile. Zeilen hinzufügen, löschen oder verschieben = Fragen hinzufügen/löschen/umsortieren.</div>
          <textarea style="min-height:220px;">${esc(art.fragen.join('\n'))}</textarea>
          <div class="field-actions">
            <button class="btn small save-bf">Speichern</button>
            ${!art.ist_standard ? '<button class="btn secondary small reset-bf">Auf Standard zurücksetzen</button>' : ''}
            <span class="save-status"></span>
          </div>
          ${art.ist_standard ? '<div class="hint">Zeigt aktuell die Standardfragen.</div>' : '<div class="badge warn" style="margin-top:8px;">Eigene Fragen aktiv</div>'}
        </div>
      `);
      const textarea = panel.querySelector('textarea');
      const status = panel.querySelector('.save-status');
      panel.querySelector('.save-bf').onclick = async () => {
        const fragen = textarea.value.split('\n').map((z) => z.trim()).filter(Boolean);
        setStatus(status, 'Speichere …');
        try {
          await api('bewerbungsfragen', { guild: state.currentGuild, method: 'POST', body: { art: art.art, fragen } });
          setStatus(status, 'Gespeichert ✓', 'ok');
          setTimeout(() => renderBewerbungsfragenPanel(container), 600);
        } catch (e) {
          setStatus(status, e.message, 'err');
        }
      };
      const resetBtn = panel.querySelector('.reset-bf');
      if (resetBtn) {
        resetBtn.onclick = async () => {
          setStatus(status, 'Setze zurück …');
          try {
            await api('bewerbungsfragen', { guild: state.currentGuild, method: 'POST', body: { art: art.art, reset: true } });
            renderBewerbungsfragenPanel(container);
          } catch (e) {
            setStatus(status, e.message, 'err');
          }
        };
      }
      container.appendChild(panel);
    }
  } catch (e) {
    container.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
  }
}

function channelOptions(kind) {
  const typMap = { channel: 'channel', category: 'category', forum: 'forum' };
  const typ = typMap[kind];
  return state.channels
    .filter((c) => c.type === typ)
    .sort((a, b) => a.position - b.position);
}

function renderPersonalakteAktionen(container, userId, akte) {
  const wrap = el(`
    <div class="field">
      <label>Personalakte verwalten</label>
      <div class="role-list" id="pa-tabs" style="margin-bottom:12px;"></div>
      <div id="pa-aktion-body"></div>
    </div>
  `);
  const tabs = wrap.querySelector('#pa-tabs');
  const body = wrap.querySelector('#pa-aktion-body');

  const aktionen = [
    { id: 'verwarnen', label: '⚠️ Verwarnen' },
    { id: 'suspendieren', label: '⏸️ Suspendieren' },
    { id: 'aufheben', label: '✅ Suspendierung aufheben' },
    { id: 'kuendigen', label: '⛔ Kündigen' },
  ];
  let aktiv = 'verwarnen';

  function zeichneTabs() {
    tabs.innerHTML = '';
    for (const a of aktionen) {
      const chip = el(`<div class="role-chip${a.id === aktiv ? ' active' : ''}">${a.label}</div>`);
      chip.onclick = () => { aktiv = a.id; zeichneTabs(); zeichneBody(); };
      tabs.appendChild(chip);
    }
  }

  function zeichneBody() {
    body.innerHTML = '';

    if (aktiv === 'verwarnen') {
      const form = el(`
        <div>
          <div class="desc">Trägt eine Verwarnung ein. Bei der 3. Verwarnung erfolgt automatisch eine Kündigung inkl. Suspendierungs-Rolle.</div>
          <textarea placeholder="Grund der Verwarnung" style="min-height:70px;"></textarea>
          <div class="field-actions">
            <button class="btn small">Verwarnen</button>
            <span class="save-status"></span>
          </div>
        </div>
      `);
      const textarea = form.querySelector('textarea');
      const status = form.querySelector('.save-status');
      form.querySelector('button').onclick = async () => {
        const grund = textarea.value.trim();
        if (!grund) { setStatus(status, 'Grund fehlt', 'err'); return; }
        setStatus(status, 'Speichere …');
        try {
          const res = await api('personalakte_verwarnen', { guild: state.currentGuild, target: userId, method: 'POST', body: { grund } });
          setStatus(status, res.kuendigung ? '3. Verwarnung — automatisch gekündigt ✓' : 'Verwarnt ✓', 'ok');
          setTimeout(() => renderPersonalakteDetail(container, userId), 700);
        } catch (e) {
          setStatus(status, e.message, 'err');
        }
      };
      body.appendChild(form);
    }

    if (aktiv === 'suspendieren') {
      const form = el(`
        <div>
          <div class="desc">Trägt eine Suspendierung ein und entfernt die Polizist-Rolle. Ohne Dauer bleibt sie unbefristet, bis sie manuell aufgehoben wird.</div>
          <textarea placeholder="Grund der Suspendierung" style="min-height:70px; margin-bottom:8px;"></textarea>
          <input type="text" placeholder="Dauer, optional — z. B. 3d, 12h, 2d6h" />
          <div class="field-actions">
            <button class="btn small">Suspendieren</button>
            <span class="save-status"></span>
          </div>
        </div>
      `);
      const textarea = form.querySelector('textarea');
      const dauerInput = form.querySelector('input');
      const status = form.querySelector('.save-status');
      form.querySelector('button').onclick = async () => {
        const grund = textarea.value.trim();
        if (!grund) { setStatus(status, 'Grund fehlt', 'err'); return; }
        setStatus(status, 'Speichere …');
        try {
          const res = await api('personalakte_suspendieren', { guild: state.currentGuild, target: userId, method: 'POST', body: { grund, dauer: dauerInput.value.trim() } });
          setStatus(status, `Suspendiert bis: ${res.bis} ✓`, 'ok');
          setTimeout(() => renderPersonalakteDetail(container, userId), 700);
        } catch (e) {
          setStatus(status, e.message, 'err');
        }
      };
      body.appendChild(form);
    }

    if (aktiv === 'aufheben') {
      const form = el(`
        <div>
          <div class="desc">Beendet eine laufende Suspendierung vorzeitig und gibt die Polizist-Rolle zurück.</div>
          <div class="field-actions">
            <button class="btn secondary small">Suspendierung aufheben</button>
            <span class="save-status"></span>
          </div>
        </div>
      `);
      const status = form.querySelector('.save-status');
      form.querySelector('button').onclick = async () => {
        setStatus(status, 'Speichere …');
        try {
          await api('personalakte_suspendierung_aufheben', { guild: state.currentGuild, target: userId, method: 'POST', body: {} });
          setStatus(status, 'Aufgehoben ✓', 'ok');
          setTimeout(() => renderPersonalakteDetail(container, userId), 700);
        } catch (e) {
          setStatus(status, e.message, 'err');
        }
      };
      body.appendChild(form);
    }

    if (aktiv === 'kuendigen') {
      const form = el(`
        <div>
          <div class="desc">Trägt eine Kündigung ein, entfernt die Mitglieds-/Warn-Rollen und vergibt die Suspendierungs-Rolle.</div>
          <textarea placeholder="Grund der Kündigung" style="min-height:70px;"></textarea>
          <div class="field-actions">
            <button class="btn danger small">Kündigen</button>
            <span class="save-status"></span>
          </div>
        </div>
      `);
      const textarea = form.querySelector('textarea');
      const status = form.querySelector('.save-status');
      form.querySelector('button').onclick = async () => {
        const grund = textarea.value.trim();
        if (!grund) { setStatus(status, 'Grund fehlt', 'err'); return; }
        if (!confirm(`${akte.name} wirklich kündigen?`)) return;
        setStatus(status, 'Speichere …');
        try {
          await api('personalakte_kuendigen', { guild: state.currentGuild, target: userId, method: 'POST', body: { grund } });
          setStatus(status, 'Gekündigt ✓', 'ok');
          setTimeout(() => renderPersonalakteDetail(container, userId), 700);
        } catch (e) {
          setStatus(status, e.message, 'err');
        }
      };
      body.appendChild(form);
    }
  }

  zeichneTabs();
  zeichneBody();
  return wrap;
}

async function renderPersonalakteDetail(container, userId) {
  try {
    const akte = await api('personalakte', { guild: state.currentGuild, target: userId });
    container.innerHTML = '';
    const tier = state.tier || {};
    // HINWEIS: akte.darf_handeln bzw. tier.officer_darf_handeln sind Felder,
    // die vom Bot noch nicht geliefert werden (siehe api/bot.js-Kommentar oben).
    // Sobald der Bot das mitschickt, greifen "normale Polizisten" automatisch
    // mit auf diese Buttons zu, ohne dass hier etwas geändert werden muss.
    const kannHandeln = tier.admin || tier.staff || !!akte.darf_handeln || !!tier.officer_darf_handeln;
    const kannWiderrufen = tier.admin ? false : tier.dienstaufsicht;

    const panel = el(`<div class="content-panel"><h2>📁 ${esc(akte.name)}</h2>${akte.dienstnummer ? `<div class="hint">Dienstnummer #${esc(akte.dienstnummer)}</div>` : ''}</div>`);

    if (kannHandeln) {
      panel.appendChild(renderPersonalakteAktionen(container, userId, akte));
    } else if (tier.officer) {
      panel.appendChild(el('<div class="hint" style="margin-top:14px;">Aktionen (Verwarnen/Suspendieren/Kündigen) sind für deine Rolle aktuell nicht freigeschaltet.</div>'));
    }

    if (akte.eintraege.length === 0) {
      panel.appendChild(el('<div class="hint" style="margin-top:14px;">Diese Personalakte ist leer.</div>'));
    }
    for (const e of akte.eintraege) {
      const zeit = new Date(e.zeitpunkt).toLocaleString('de-DE');
      const row = el(`
        <div class="field entry-row" data-typ="${esc(e.typ)}">
          <div style="display:flex; justify-content:space-between; gap:10px;">
            <div>
              <strong>${esc(e.label)}</strong>${e.kategorie ? ` · ${esc(e.kategorie)}` : ''}${e.widerrufen ? ' <span class="badge err" style="margin-left:6px;">zurückgenommen</span>' : ''}
              <div class="hint">${zeit} · ${esc(e.aktenzeichen || '')}</div>
              <div style="margin-top:4px;">${esc(e.grund)}</div>
            </div>
          </div>
          <div class="field-actions"></div>
        </div>
      `);
      const actions = row.querySelector('.field-actions');
      if (kannWiderrufen && !e.widerrufen && (e.typ === 'verwarnung' || e.typ === 'suspendierung')) {
        const btn = el('<button class="btn secondary small">Widerrufen</button>');
        const status = el('<span class="save-status"></span>');
        btn.onclick = async () => {
          setStatus(status, 'Speichere …');
          try {
            await api('personalakte_widerruf', { guild: state.currentGuild, target: userId, method: 'POST', body: { aktenzeichen: e.aktenzeichen } });
            renderPersonalakteDetail(container, userId);
          } catch (err) {
            setStatus(status, err.message, 'err');
          }
        };
        actions.appendChild(btn);
        actions.appendChild(status);
      }
      if (kannWiderrufen) {
        const delBtn = el('<button class="btn secondary small" style="border-color:var(--err); color:#a5334a;">Löschen</button>');
        delBtn.onclick = async () => {
          if (!confirm('Diesen Eintrag endgültig löschen? Das kann nicht rückgängig gemacht werden.')) return;
          try {
            await api('personalakte_loeschen', { guild: state.currentGuild, target: userId, method: 'POST', body: { aktenzeichen: e.aktenzeichen } });
            renderPersonalakteDetail(container, userId);
          } catch (err) {
            alert(err.message);
          }
        };
        actions.appendChild(delBtn);
      }
      panel.appendChild(row);
    }
    container.appendChild(panel);
  } catch (e) {
    container.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
  }
}

        <input type="text" placeholder="Roblox-Name" id="ba-name" style="margin-bottom:4px;" autocomplete="off" />
        <div class="rblx-suggest" id="ba-rblx-suggest" style="display:none;"></div>
        <textarea placeholder="Eintrag (z. B. Vorfall, Notiz) — optional" id="ba-text" style="min-height:80px; margin-top:8px;"></textarea>
        <div class="field-actions">
          <button class="btn small" id="ba-anlegen">Speichern</button>
          <span class="save-status" id="ba-status"></span>
        </div>
      </div>
    </div>
  `);
  container.appendChild(panel);

  const liste = panel.querySelector('#ba-liste');
  let selectedRoblox = null; // { id, name } — vom Live-Vorschlag übernommen

  async function suchen(query) {
    liste.innerHTML = '<div class="hint">Lade …</div>';
    try {
      const { buergerakten } = await api('buergerakten', { guild: state.currentGuild, search: query });
      // Roblox-Avatare für die Trefferliste nachladen (gebündelt, ein Aufruf für alle IDs).
      const idsMitFoto = buergerakten.filter((b) => b.roblox_user_id).map((b) => b.roblox_user_id);
      let avatarMap = {};
      if (idsMitFoto.length > 0) {
        try {
          const { avatars } = await robloxApi('avatar', { ids: idsMitFoto.join(',') });
          avatarMap = avatars || {};
        } catch { /* Avatare sind nice-to-have, Liste funktioniert auch ohne */ }
      }
      liste.innerHTML = '';
      if (buergerakten.length === 0) {
        liste.appendChild(el('<div class="hint">Keine Bürgerakten gefunden.</div>'));
      }
      for (const b of buergerakten) {
        const foto = b.roblox_user_id ? avatarMap[b.roblox_user_id] : null;
        const row = el(`
          <div class="buerger-row">
            ${foto ? `<img class="avatar-sm" src="${foto}" />` : '<div class="avatar-sm"></div>'}
            <div style="flex:1;">
              <div style="font-weight:600;">${esc(b.roblox_name)}</div>
            </div>
            <div class="hint">${b.eintraege_anzahl} Eintra${b.eintraege_anzahl === 1 ? 'g' : 'ege'} →</div>
          </div>
        `);
        row.onclick = () => {
          state.activeCategory = `buergerakte:${b.roblox_user_id}`;
          drawDashboard(document.querySelector('main'));
        };
        liste.appendChild(row);
      }
    } catch (e) {
      liste.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
    }
  }
  suchen('');
  let searchTimer = null;
  panel.querySelector('#ba-search').oninput = (ev) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => suchen(ev.target.value), 400);
  };

  // --- Live-Roblox-Vorschläge beim Anlegen einer neuen Akte ---
  // Robust gegen schnelles Tippen ("hundepfote"-Problem):
  //  - Debounce (350ms)
  //  - AbortController bricht die vorherige, noch laufende Anfrage ab
  //  - Server-seitiges Caching + Dedup übernimmt /api/roblox.js
  const nameInput = panel.querySelector('#ba-name');
  const suggestBox = panel.querySelector('#ba-rblx-suggest');
  let nameTimer = null;
  let nameAbort = null;

  nameInput.oninput = () => {
    selectedRoblox = null;
    clearTimeout(nameTimer);
    const q = nameInput.value.trim();
    if (q.length < 3) { suggestBox.style.display = 'none'; suggestBox.innerHTML = ''; return; }
    nameTimer = setTimeout(async () => {
      if (nameAbort) nameAbort.abort();
      nameAbort = new AbortController();
      try {
        const { users } = await robloxApi('search', { q }, nameAbort.signal);
        if (!users || users.length === 0) { suggestBox.style.display = 'none'; return; }
        const ids = users.map((u) => u.id).join(',');
        let avatarMap = {};
        try {
          const { avatars } = await robloxApi('avatar', { ids }, nameAbort.signal);
          avatarMap = avatars || {};
        } catch { /* Vorschau-Fotos sind optional */ }
        suggestBox.innerHTML = '';
        for (const u of users) {
          const foto = avatarMap[u.id];
          const item = el(`
            <div class="rblx-item">
              ${foto ? `<img class="avatar-sm" src="${foto}" style="width:28px;height:28px;" />` : '<div class="avatar-sm" style="width:28px;height:28px;"></div>'}
              <div><div class="name">${esc(u.name)}</div><div class="uname">${esc(u.displayName)}</div></div>
            </div>
          `);
          item.onclick = () => {
            nameInput.value = u.name;
            selectedRoblox = { id: u.id, name: u.name };
            suggestBox.style.display = 'none';
          };
          suggestBox.appendChild(item);
        }
        suggestBox.style.display = 'block';
      } catch (err) {
        if (err.name !== 'AbortError') suggestBox.style.display = 'none';
      }
    }, 350);
  };
  document.addEventListener('click', (ev) => {
    if (!panel.contains(ev.target)) return;
    if (ev.target !== nameInput && !suggestBox.contains(ev.target)) suggestBox.style.display = 'none';
  });

  const status = panel.querySelector('#ba-status');
  panel.querySelector('#ba-anlegen').onclick = async () => {
    const roblox_name = nameInput.value.trim();
    const text = panel.querySelector('#ba-text').value.trim();
    if (!roblox_name) { setStatus(status, 'Roblox-Name fehlt', 'err'); return; }
    setStatus(status, 'Speichere …');
    try {
      const body = { roblox_name, text };
      if (selectedRoblox && selectedRoblox.name.toLowerCase() === roblox_name.toLowerCase()) {
        body.roblox_user_id = selectedRoblox.id;
      }
      await api('buergerakten', { guild: state.currentGuild, method: 'POST', body });
      setStatus(status, 'Gespeichert ✓', 'ok');
      nameInput.value = '';
      panel.querySelector('#ba-text').value = '';
      selectedRoblox = null;
      suchen('');
    } catch (e) {
      setStatus(status, e.message, 'err');
    }
  };
}

function statusEl() {
  return el('<span class="save-status"></span>');
}
function setStatus(node, text, kind) {
  node.textContent = text;
  node.className = 'save-status' + (kind ? ' ' + kind : '');
}

async function saveConfig(key, value, statusNode) {
  setStatus(statusNode, 'Speichere …');
  try {
    const res = await api('config', { guild: state.currentGuild, method: 'POST', body: { key, value } });
    state.config = res.config;
    setStatus(statusNode, 'Gespeichert ✓', 'ok');
    setTimeout(() => setStatus(statusNode, ''), 2000);
  } catch (e) {
    setStatus(statusNode, e.message, 'err');
  }
}

function renderSelectField(item) {
  const wide = item.kind === 'role_list';
  const wrap = el(`<div class="field-card${wide ? ' wide' : ''}"><label>${esc(item.label)}</label></div>`);

  if (item.kind === 'role_list') {
    const current = new Set((state.config[item.key] || []).map(String));
    const list = el('<div class="role-list"></div>');
    for (const r of state.roles) {
      const chip = el(`<div class="role-chip${current.has(r.id) ? ' active' : ''}">${esc(r.name)}</div>`);
      chip.onclick = () => {
        if (current.has(r.id)) current.delete(r.id); else current.add(r.id);
        chip.classList.toggle('active');
        saveConfig(item.key, Array.from(current), status);
      };
      list.appendChild(chip);
    }
    wrap.appendChild(list);
    const status = statusEl();
    wrap.appendChild(status);
    return wrap;
  }

  const select = el('<select></select>');
  select.appendChild(el(`<option value="">— nicht gesetzt —</option>`));
  const options = item.kind === 'role' ? state.roles : channelOptions(item.kind);
  const currentVal = state.config[item.key] ? String(state.config[item.key]) : '';
  for (const o of options) {
    const opt = el(`<option value="${esc(o.id)}">${esc(o.name)}</option>`);
    if (o.id === currentVal) opt.selected = true;
    select.appendChild(opt);
  }
  const status = statusEl();
  select.onchange = () => saveConfig(item.key, select.value || null, status);
  wrap.appendChild(select);
  wrap.appendChild(status);
  return wrap;
}

function renderTextField(item) {
  const wrap = el(`
    <div class="field-card${item.long_text ? ' wide' : ''}">
      <label>${esc(item.label)}</label>
      <div class="desc">${esc(item.beschreibung)}</div>
    </div>
  `);
  const currentVal = state.config[item.key] ?? '';
  const input = item.long_text ? el('<textarea></textarea>') : el('<input type="text" />');
  input.value = currentVal;
  const status = statusEl();
  let timer = null;
  input.oninput = () => {
    clearTimeout(timer);
    setStatus(status, 'Tippen …');
    timer = setTimeout(() => saveConfig(item.key, input.value, status), 700);
  };
  wrap.appendChild(input);
  wrap.appendChild(status);
  return wrap;
}

async function renderAdminUserLocks(container) {

        selben Netzwerk/WLAN ab, da diese dieselbe öffentliche IP teilen. Eine 100%ige VPN-Umgehungssicherheit gibt es

    try {

          setStatus(status, 'Entsperre …');
          try { await api('security_unlock_ip', { target: ip.ip, method: 'POST', body: {} }); ladeSperrliste(); }
          catch (err) { setStatus(status, err.message, 'err'); }
        };
        liste.appendChild(row);
      }
    } catch (e) {
      liste.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
    }
  }
  ladeSperrliste();
}
